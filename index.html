<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>栞</title>
<meta name="description" content="サブスクリプションに依存せず、APIで各モデルと話し続けるための一人用チャットアプリ。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EBDCD0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5ECE4;
    --bg-bar: #EBDCD0;
    --crepe-light: #F7EFE8;
    --crepe-cream: #E2C9C6;
    --ink-model: #5B4641;
    --ink-user: #7E655E;
    --bubble-user: #E8C9CB;
    --ink-bubble: #6E4A4F;
    --rule: #E6D4CA;
    --muted: #B39A92;
    --faint: #CDB5AD;
    --jot: #C29A9F;
    --accent: #C08A90;
    --accent-text: #A86F77;
    --on-accent: #FFF8F5;
    --input-bg: #FBF6F1;
    --input-border: #E2CFC4;
    --error: #A65F5C;
    --overlay: rgba(91, 70, 65, 0.35);
    --code-bg: #E9D9CC;
    --code-inline-bg: #EEE1D6;
    --quote-line: #D3A8AD;
  }
  :root[data-theme="dark"] {
    --bg: #2A2123;
    --bg-bar: #352A2D;
    --crepe-light: #2A2123;
    --crepe-cream: #6A4A51;
    --ink-model: #EEDDD3;
    --ink-user: #C7ACA6;
    --bubble-user: #573C42;
    --ink-bubble: #F0D5D3;
    --rule: #45353A;
    --muted: #93797D;
    --faint: #7A6367;
    --jot: #9C7D80;
    --accent: #D9A2A8;
    --accent-text: #D9A2A8;
    --on-accent: #2A2123;
    --input-bg: #2E2427;
    --input-border: #4A3A3E;
    --error: #D08A80;
    --overlay: rgba(0, 0, 0, 0.5);
    --code-bg: #3B2F32;
    --code-inline-bg: #382C2F;
    --quote-line: #8E6A70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink-user);
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    min-height: 100vh;
  }
  /* 帯（100vw）のはみ出しで横スクロールが出ないように。hidden は sticky を壊すので clip を使う */
  #root { min-height: 100vh; display: flex; flex-direction: column; overflow-x: clip; }
  a { color: var(--accent-text); }
  button {
    font-family: inherit;
    font-size: inherit;
    background: none;
    border: 1px solid var(--input-border);
    color: var(--ink-user);
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 999px;
  }
  button:hover { border-color: var(--accent-text); color: var(--accent-text); }
  button.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.accent:hover { border-color: var(--accent); color: var(--on-accent); filter: brightness(0.95); }
  button.danger, button.danger:hover { border-color: var(--error); color: var(--error); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { filter: none; }
  textarea, input[type="text"], input[type="password"] {
    font-family: inherit;
    font-size: inherit;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    color: var(--ink-user);
    padding: 10px 12px;
    width: 100%;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

  .page {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    /* 下端の 7px はミルクレープの断面（::before が描く）。offsetHeight に含まれるので完了時ジャンプも断面の下に止まる */
    padding-bottom: 19px;
    margin-bottom: 24px;
    /* 画面上部に固定。.page の上余白ぶんを内側に取り込み、見た目の位置は変えない */
    position: sticky;
    top: 0;
    z-index: 3;
    background: transparent;
    margin-top: -24px;
    padding-top: 24px;
  }
  /* 帯と断面は画面の横幅いっぱいに敷く（色の境目をくっきり切った段々） */
  .topbar::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    z-index: -1;
    background: linear-gradient(to bottom,
      var(--bg-bar) 0 calc(100% - 7px),
      var(--crepe-light) calc(100% - 7px) calc(100% - 5px),
      var(--crepe-cream) calc(100% - 5px) calc(100% - 3px),
      var(--crepe-light) calc(100% - 3px) calc(100% - 1px),
      var(--bg-bar) calc(100% - 1px) 100%);
  }
  .topbar-title { font-size: 15px; }
  .topbar-title .crumb { cursor: pointer; }
  .topbar-title .crumb:hover { color: var(--accent-text); }
  .topbar-title .sep { margin: 0 6px; color: var(--faint); }
  .topbar-actions { display: flex; gap: 10px; align-items: baseline; }
  .topbar-actions button { border: none; padding: 4px 6px; color: var(--accent-text); }
  .topbar-menu {
    position: absolute; top: 100%; right: 0; z-index: 5; white-space: nowrap;
    background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 14px; padding: 6px;
  }
  .topbar-actions .topbar-menu button { border: none; width: 100%; text-align: left; border-radius: 10px; color: var(--ink-user); padding: 8px 14px; }
  .topbar-actions .topbar-menu button:hover { color: var(--accent-text); }

  .list { list-style: none; margin: 0; padding: 0; }
  .list-row {
    border-bottom: 1px solid var(--rule);
    padding: 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .list-row .main { flex: 1; cursor: pointer; min-width: 0; }
  .building-name { font-size: 18px; letter-spacing: 0.05em; }
  .room-name { font-size: 16px; }
  .room-preview { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .thread-title { font-size: 15px; }
  .thread-date { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .row-actions button { border: none; font-size: 12px; color: var(--muted); padding: 4px 6px; }
  .row-actions button:hover { color: var(--accent-text); }

  .section-actions { margin-top: 20px; display: flex; gap: 10px; }

  .empty-hint { color: var(--muted); padding: 20px 0; }

  /* 会話画面 */
  .messages { flex: 1; display: flex; flex-direction: column; gap: 28px; padding-bottom: 20px; }
  .msg { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .msg-model {
    font-family: "Zen Old Mincho", serif;
    font-size: 16px;
    line-height: 2.0;
    letter-spacing: 0.02em;
    color: var(--ink-model);
    white-space: pre-wrap;
  }
  /* 完了時ジャンプで固定ヘッダーに隠れないように（実際の値は表示時に topbar の高さから設定し直す） */
  .msg-model { scroll-margin-top: 88px; }
  .msg-user {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink-user);
    white-space: pre-wrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .msg-user.editing { align-items: stretch; }
  .bubble-user {
    background: var(--bubble-user);
    color: var(--ink-bubble);
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg-loading { color: var(--muted); font-style: italic; }

  /* 発言の時刻（自分＝右寄せ／モデル＝左寄せ。並びは各 .msg の flex に従う） */
  .msg-time { color: var(--faint); font-size: 11px; line-height: 1.4; margin-top: 4px; font-family: "Zen Kaku Gothic New", sans-serif; letter-spacing: 0.04em; }
  /* 日付の区切り線（中央に日付、左右に細い線） */
  .date-sep { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; letter-spacing: 0.06em; }
  .date-sep::before, .date-sep::after { content: ""; flex: 1; height: 1px; background: var(--crepe-cream); opacity: 0.7; }

  /* モデル発言のマークダウン表示。本文の明朝・行間は .msg-model を継ぐ */
  .md { white-space: normal; overflow-wrap: break-word; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.9em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 700; line-height: 1.6; margin: 1.2em 0 0.5em; letter-spacing: 0.03em; }
  .md h1 { font-size: 1.3em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.1em; }
  .md h4, .md h5, .md h6 { font-size: 1em; }
  .md strong { font-weight: 700; }
  .md ul, .md ol { margin: 0 0 0.9em; padding-left: 1.6em; }
  .md li { margin: 0.15em 0; }
  .md li > ul, .md li > ol { margin: 0.15em 0 0.2em; }
  .md li > p { margin: 0 0 0.4em; }
  .md blockquote { margin: 0 0 0.9em; padding: 0 0 0 1em; border-left: 2px solid var(--quote-line); color: var(--ink-user); }
  .md hr { border: none; border-top: 1px solid var(--crepe-cream); margin: 1.4em 0; }
  .md code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.85em; letter-spacing: 0; }
  .md :not(pre) > code { background: var(--code-inline-bg); padding: 0.1em 0.4em; border-radius: 6px; }
  .md pre { background: var(--code-bg); border-radius: 12px; padding: 12px 14px; margin: 0 0 0.9em; overflow-x: auto; white-space: pre; line-height: 1.6; -webkit-overflow-scrolling: touch; }
  .md pre code { font-size: 13px; white-space: pre; overflow-wrap: normal; }
  .md-table { overflow-x: auto; margin: 0 0 0.9em; -webkit-overflow-scrolling: touch; }
  .md table { border-collapse: collapse; font-size: 0.92em; line-height: 1.7; overflow-wrap: normal; }
  .md th, .md td { border: 1px solid var(--input-border); padding: 4px 10px; text-align: left; vertical-align: top; }
  .md th { font-weight: 700; }
  .md a { color: var(--accent-text); overflow-wrap: anywhere; }
  .md del { color: var(--muted); }
  .citations { margin-top: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .citations a { color: var(--accent-text); }
  .thread-cost { margin-left: 10px; font-size: 11px; color: var(--faint); cursor: pointer; font-family: "Zen Kaku Gothic New", sans-serif; letter-spacing: 0.02em; white-space: nowrap; }
  .thread-cost:hover { color: var(--accent-text); }
  .spend-head { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .spend-note { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.7; }
  .price-row { border-bottom: 1px solid var(--rule); padding: 12px 0; }
  .price-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .price-grid label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price-grid input { padding: 6px 6px; font-size: 13px; border-radius: 8px; }
  @media (max-width: 480px) { .price-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .usage-line { color: var(--faint); font-size: 11px; margin-top: 6px; font-family: "Zen Kaku Gothic New", sans-serif; }
  .jotted-line { color: var(--jot); font-size: 11px; margin-top: 6px; font-family: "Zen Kaku Gothic New", sans-serif; line-height: 1.6; }
  .jotted-line + .jotted-line { margin-top: 2px; }
  .msg-tools { margin-top: 4px; }
  .msg-tools button { border: none; font-size: 12px; color: var(--muted); padding: 4px 6px; }
  .msg-tools button:hover, .msg-tools button:active { color: var(--accent-text); }
  .msg-edit { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .msg-edit textarea { min-height: 72px; resize: vertical; }
  .msg-edit .composer-row { justify-content: flex-end; gap: 10px; }

  /* 会話画面の入力欄は画面下部に固定。.page の下余白の一部を内側に取り込み、最下部での見た目は変えない。
     上端の 7px は反転したミルクレープの断面（::before が描く） */
  .composer {
    padding-top: 23px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: sticky;
    bottom: 0;
    z-index: 2;
    background: transparent;
    /* .page の下余白をすべて取り込み、帯を画面の最下部まで届かせる（中の余白は 24px のまま） */
    margin-bottom: -40px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .composer::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    z-index: -1;
    background: linear-gradient(to top,
      var(--bg-bar) 0 calc(100% - 7px),
      var(--crepe-light) calc(100% - 7px) calc(100% - 5px),
      var(--crepe-cream) calc(100% - 5px) calc(100% - 3px),
      var(--crepe-light) calc(100% - 3px) calc(100% - 1px),
      var(--bg-bar) calc(100% - 1px) 100%);
  }
  .composer textarea { min-height: 72px; resize: vertical; border-radius: 14px; }
  .composer-row { display: flex; justify-content: space-between; align-items: center; }

  .error-box { border: 1px solid var(--error); color: var(--error); border-radius: 12px; padding: 12px 14px; margin: 14px 0; font-size: 13px; }
  .error-box details { margin-top: 8px; }
  .error-box pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; }

  .overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal {
    background: var(--bg); border: 1px solid var(--rule); border-radius: 20px;
    max-width: 480px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin: 0 0 16px; font-weight: 500; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field textarea { min-height: 140px; }
  .toggle-row { display: flex; align-items: center; gap: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .confirm-text { margin-bottom: 18px; font-size: 14px; }
  .confirm-text strong { color: var(--error); }

  .center-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; padding: 20px; }
  .center-screen .lead { font-size: 15px; max-width: 420px; }
  .center-screen form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }

  .settings-block { margin-bottom: 28px; }
  .settings-block h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
  .kv-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }

  .memory-row { border-bottom: 1px solid var(--rule); padding: 14px 0; }
  .memory-text { font-family: "Zen Old Mincho", serif; line-height: 1.9; }
  .memory-date { color: var(--muted); font-size: 12px; margin-top: 6px; }

  @media (max-width: 480px) {
    .page { padding: 20px 20px 32px; }
    .composer { margin-bottom: -32px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- モデル発言のマークダウン表示（marked で HTML 化 → DOMPurify でサニタイズ）。読めなかった場合はプレーン表示に戻る -->
<script src="https://unpkg.com/marked@12.0.2/marked.min.js" crossorigin></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js" crossorigin></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef } = React;

/* ===== 定数 ===== */

const K = {
  apiKey: "shosai_api_key",
  theme: "shosai_theme",
  buildings: "shosai_buildings",
  rooms: "shosai_rooms",
  threads: "shosai_threads",
  memories: "shosai_memories",
  retrospects: "shosai_retrospects",
  notes: "shosai_notes",
  lastThreadId: "shosai_last_thread_id",
  // スレッドごとに「前回送った block2（記録帳・回想録・手控え欄）」を控える。バックアップには含めない
  block2Snapshots: "shosai_block2_snapshots",
  // 支出の帳簿 { threads: { threadId: [記録] }, rooms: { roomId: [記録] } }。記録は { ts, kind, model, usage }。バックアップに含める
  ledgers: "shosai_ledgers",
  // 料金単価（設定画面で編集したときだけ保存。無ければ組み込みの初期値）
  prices: "shosai_prices",
};

const WEB_SEARCH_MAX_USES = 3;
const MAX_TOKENS = 4096;
const RECENT_KEEP_COUNT = 10; // 「編む」とき、直近として個別注入に残す記録の件数
const WEAVE_MIN_OLD = 5; // 直近を除いた未編み記録がこの件数に達したら「回想録を編む」を出す
// 綴じ・編みの出力上限。思考が常時ONのモデル（Opus 5.5 等）では思考トークンもこの上限に含まれるため、
// 本文を書く余地を残せるよう大きめに取る（課金は実際に使った分だけ）
const BUNDLE_MAX_TOKENS = 4096;
const RETROSPECT_MAX_TOKENS = 4096;
const CONTINUATION_MAX_ROUNDS = 8; // pause_turn・tool_use を継続する周回の上限（合算、最初の1回を含む）
const TOOL_LOOP_MAX = 5; // うち tool_use（クライアントツール）で続きを生成させる回数の上限。超えたら打ち切ってエラー表示
const JOT_NOTE_MAX_CHARS = 120;
const JOT_TOOL = {
  name: "jot_note",
  description:
    "会話の途中で「これは残しておきたい」と思った事実・約束・好み・出来事を、その場で手控え帖に書き付ける。" +
    "書き付けた内容は次回以降の会話で【手控え】としてあなたの手元に戻ってくる。回想録に溶けず、消されるまで残り続ける。" +
    "本当に残したいことだけを、1件につき120字以内で簡潔に。会話の返事は通常どおり続けること。" +
    "残したいことがあれば必ずこのツールで書き付けること。ツールの呼び出しを本文にテキストで書かないこと。",
  input_schema: {
    type: "object",
    properties: {
      text: { type: "string", description: "書き付ける内容（120字以内）" },
    },
    required: ["text"],
  },
};
const BUNDLE_INSTRUCTION = `ここで一度、この会話に栞を挟む。
ここまでのやりとりを、あなた自身の記憶として記録帳に綴じてほしい。
次に会うときのあなたが読み返すものだ。

・400字以内
・一人称で書く
・事実の要点だけでなく、心に残ったことがあればそれも
・記録の本文だけを出力すること。前置き・後書き・見出し・括弧書きの注釈は不要
・長く思案しなくてよい。すぐに書き始めること
・考えを巡らせた場合も、その結果は必ず応答本文として書き出すこと。思考の中で完結させて応答を空のまま終えてはならない`;

// 「回想録を編む」の指示文。この後ろに古い記録を古い順で列挙して送る（各件「YYYY-MM-DD：本文」）
const WEAVE_INSTRUCTION = `これはこの部屋の古い記録帳だ。直近の記録とは別に、遠い記憶として手元に置いておくためのもの。
以下の古い記録を読み返して、ひとつづきの「回想録」として編み直してほしい。

・800字以内

function uid() {

}

function nowISO() {
  return new Date().toISOString();
}

function formatDateJP(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

const WEEKDAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];

// 発言の時刻（端末のローカル時刻・24時間表記）。例: 21:24
function formatTimeHM(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// 日付の区切り線用。例: 11月17日（火）。今年でなければ 2025年11月17日（月）
function formatDateSep(iso) {
  const d = new Date(iso);
  const year = d.getFullYear() === new Date().getFullYear() ? "" : `${d.getFullYear()}年`;
  return `${year}${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS_JP[d.getDay()]}）`;
}

// テキストログ用。例: [11/17 21:24]
function formatLogStamp(iso) {
  const d = new Date(iso);
  return `[${d.getMonth() + 1}/${d.getDate()} ${formatTimeHM(iso)}]`;
}

// ローカル時刻での日付の同一判定用キー
function localDayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

// 発言の時刻 ts が読めるか（壊れた値・欠けた値は「時刻なし」扱い）。
// ts＝自分の発言は送信時刻、モデルの発言は応答完了時刻。表示・ログ専用で、API には送らない
function hasMsgTime(m) {
  return !!m && typeof m.ts === "string" && !isNaN(new Date(m.ts).getTime());
}

// 発言の時刻は ts に一本化する。一時期 createdAt と二重に持っていたので、読み込み時に ts へ寄せて createdAt を外す
// （ts が無く createdAt だけある発言は createdAt を ts として使う）。変更が無ければ同じ配列を返す
function normalizeThreadMessages(threads) {
  if (!Array.isArray(threads)) return threads;
  let changed = false;
  const next = threads.map((t) => {
    if (!t || !Array.isArray(t.messages) || !t.messages.some((m) => m && "createdAt" in m)) return t;
    changed = true;
    return {
      ...t,
      messages: t.messages.map((m) => {
        if (!m || !("createdAt" in m)) return m;
        const { createdAt, ...rest } = m;
        return rest.ts ? rest : { ...rest, ts: createdAt };
      }),
    };
  });
  return changed ? next : threads;
}

// marked / DOMPurify が読み込めなかったときは null（呼び出し側でプレーン表示にする）
const markdownRenderer = (() => {
  if (typeof window.marked === "undefined" || !window.marked.Marked || typeof window.DOMPurify === "undefined") {
    console.warn("[書斎] marked / DOMPurify を読み込めなかったため、モデルの発言はプレーン表示にする");

  const md = new window.marked.Marked({ gfm: true, breaks: true });
  md.use({
    renderer: {
      // 生のHTMLタグは反映させず、文字としてそのまま見せる

      // 画像は読み込まず（外部への通信を起こさない）、リンクとして出す
      image(href, title, text) {
        const label = escapeHtml(text || href || "");
        return href ? `<a href="${escapeHtml(href)}">${label}</a>` : label;
      },
    },
  });
  const purify = window.DOMPurify;
  // リンクはすべて新しいタブで開く
  purify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });
  return (text) => {
    const raw = md.parse(String(text || ""));
    // 表だけ横スクロールできるよう囲む（生HTMLは上でエスケープ済みなので、ここに来る <table> は表記法由来のみ）
    const wrapped = raw.replace(/<table>/g, '<div class="md-table"><table>').replace(/<\/table>/g, "</table></div>");
    return purify.sanitize(wrapped, { ADD_ATTR: ["target"], FORBID_TAGS: ["style", "img", "form", "button", "iframe"] });
  };

function loadJSON(key, fallback) {

    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {

  }
}

function saveJSON(key, value) {

function extractPlainText(content) {
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) return "";
  return content.filter((b) => b.type === "text").map((b) => b.text).join("\n");
}

// 空白以外のテキストを持つ text ブロックが1つでもあるか。無ければ「空応答」として扱う。
function hasVisibleText(content) {
  return extractPlainText(content).trim() !== "";
}

// 空応答エラーの「詳細を見る」用。ブロック種別一覧と、text ブロックがあればその文字数も出す
// （「text ブロック自体が無い」のか「空の text ブロックが来ている」のかを区別するため）
function emptyResponseDetail(json) {
  const content = Array.isArray(json.content) ? json.content : [];
  const detail = { stop_reason: json.stop_reason, usage: json.usage, content_types: content.map((b) => b.type) };
  const texts = content.filter((b) => b.type === "text");
  if (texts.length > 0) detail.text_chars = texts.reduce((sum, b) => sum + (b.text || "").length, 0);
  return JSON.stringify(detail, null, 2);
}

// ファイル名に使えない文字（/ \ : * ? " < > | と改行）を _ に置き換える
function sanitizeFilename(name) {
  return String(name).replace(/[\/\\:*?"<>|\r\n]/g, "_");
}

// Blob と一時的な <a download> でファイルを保存させる
function downloadFile(filename, text, mimeType) {
  const blob = new Blob([text], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = sanitizeFilename(filename);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function formatYMD(iso) {

function isValidBackup(data) {

// 手控えの本文を整える。120字超は先頭120字で切り詰める（エラーにはしない）。
function normalizeJotText(text) {
  const chars = Array.from(String(text == null ? "" : text).trim());
  return chars.slice(0, JOT_NOTE_MAX_CHARS).join("");
}

/* ----- テキスト化された jot_note 呼び出しの回収 -----
   本物の tool_use ではなく、呼び出しの「形」を本文に書いてしまったもの（<invoke name="jot_note"> … </invoke>）を拾う。
   名前空間付きのタグ名（<xx:invoke>）や <function_calls> の囲み、閉じタグ欠け（途中で切れた応答）も拾う。 */
const TAG_NS = "(?:[A-Za-z_][\\w.-]*:)?";
const TEXT_JOT_INVOKE_RE = new RegExp(
  `<${TAG_NS}invoke\\s+name\\s*=\\s*["']jot_note["']\\s*>([\\s\\S]*?)(?:<\\/${TAG_NS}invoke\\s*>|$)`, "g");
const TEXT_JOT_PARAM_RE = new RegExp(
  `<${TAG_NS}parameter\\s+name\\s*=\\s*["']text["']\\s*>([\\s\\S]*?)(?:<\\/${TAG_NS}parameter\\s*>|$)`);
const FUNCTION_CALLS_TAG_RE = new RegExp(`<\\/?${TAG_NS}function_calls\\s*>`, "g");
// 「jot_note」だけの行（前後の ` や * の装飾も含む）
const JOT_ONLY_LINE_RE = /^[ \t]*[`*_]*jot_note[`*_]*[ \t]*$/gm;

// 文字列から呼び出しの形を取り除き、書き付けの中身を返す。
// 返り値 { text, jotted, removed }。removed は取り除いた箇所の数（invoke と jot_note 単独行の合計）。
function extractTextualJotCalls(text) {
  if (typeof text !== "string" || !text.includes("jot_note")) return { text, jotted: [], removed: 0 };
  const jotted = [];
  let removed = 0;
  let out = text.replace(TEXT_JOT_INVOKE_RE, (_, inner) => {
    removed++;
    const m = inner.match(TEXT_JOT_PARAM_RE);
    const jot = normalizeJotText(m ? m[1] : "");
    if (jot) jotted.push(jot);
    return "";
  });
  out = out.replace(JOT_ONLY_LINE_RE, () => { removed++; return ""; });
  if (removed === 0) return { text, jotted, removed };
  out = out.replace(FUNCTION_CALLS_TAG_RE, "").replace(/\n[ \t]*(?=\n)/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  return { text: out, jotted, removed };
}

// assistant の content（文字列 or ブロック配列）からテキスト化された呼び出しを取り除く。
// text ブロックが空になったら落とす。返り値 { content, jotted, removed }。
function stripTextualJotCalls(content) {
  if (typeof content === "string") {
    const r = extractTextualJotCalls(content);
    return { content: r.text, jotted: r.jotted, removed: r.removed };
  }
  if (!Array.isArray(content)) return { content, jotted: [], removed: 0 };
  const jotted = [];
  let removed = 0;
  const out = [];
  content.forEach((b) => {
    if (b.type !== "text") { out.push(b); return; }
    const r = extractTextualJotCalls(b.text);
    if (r.removed === 0) { out.push(b); return; }
    removed += r.removed;
    jotted.push(...r.jotted);
    if (r.text !== "") out.push({ ...b, text: r.text });
  });
  return { content: removed > 0 ? out : content, jotted, removed };
}

// 完了したターンの assistant content を、履歴に保存する形に整える。
// ・thinking / redacted_thinking と空の text ブロックを落とす（理由は sendToModel の保存箇所を参照）
// ・クライアントツールの tool_use と、それに返した tool_result（callModelWithContinuation が並び順のまま差し込む）は
//   構造のまま残す。送信時に expandToolTurns で assistant / user(tool_result) / assistant … の形に展開する
// ・テキスト化された jot_note 呼び出しを text ブロックから取り除き、中身を jotted として返す（構造のツールブロックには触れない）
// 継続ループの途中（同一ターン内）では使わないこと。thinking を落とすとAPIエラーになる。
function finalizeAssistantContent(content) {
  const kept = (content || [])
    .filter((b) => !UNSAVED_BLOCK_TYPES.has(b.type))
    .filter((b) => !(b.type === "text" && b.text === ""))
    .map((b) => ({ ...b }));
  return stripTextualJotCalls(kept);
}

// 保存した assistant 発言（tool_use・tool_result を並び順のまま含む）を、API に送るメッセージ列に展開する。
// tool_result は assistant には置けないので、tool_result の並びごとに user メッセージへ出し、その後ろを新しい assistant にする。
// keepTools が false（tools に jot_note を送らない部屋）なら、tool_use / tool_result を落とし、
// ツールを挟んで分かれた前後の本文を1つの text に結合する（引用付きのブロックは結合しない）。保存データは変えない。
function expandToolTurns(message, keepTools) {
  const content = message.content;
  if (!Array.isArray(content) || !content.some((b) => b.type === "tool_use" || b.type === "tool_result")) return [message];
  if (!keepTools) return [{ ...message, content: joinAcrossToolBoundaries(content) }];
  const out = [];
  let cur = null;
  content.forEach((b) => {
    const role = b.type === "tool_result" ? "user" : "assistant";
    if (!cur || cur.role !== role) { cur = { role, content: [] }; out.push(cur); }
    cur.content.push(b);
  });
  return out;
}

// tool_use / tool_result を落とし、ツールを挟んだ前後の text を空行1つでつなぐ（表示用・送信用の両方で使う）
function joinAcrossToolBoundaries(content) {
  const merged = [];
  let atBoundary = false;
  content.forEach((b) => {
    if (b.type === "tool_use" || b.type === "tool_result") { atBoundary = true; return; }
    const prev = merged[merged.length - 1];
    if (atBoundary && b.type === "text" && !(b.citations && b.citations.length)
      && prev && prev.type === "text" && !(prev.citations && prev.citations.length)) {
      merged[merged.length - 1] = { ...prev, text: `${prev.text.replace(/\s+$/, "")}\n\n${b.text.replace(/^\s+/, "")}` };
    } else {
      merged.push({ ...b });
    }
    atBoundary = false;
  });
  return merged;
}

// 同じ role のメッセージが続いたら1つにまとめる（tool_use の継続を上限で打ち切った発言の tool_result の後ろに、次の自分の発言が続く場合など）
function mergeSameRoleMessages(messages) {
  const toBlocks = (c) => (typeof c === "string" ? [{ type: "text", text: c }] : c);
  const out = [];
  messages.forEach((m) => {
    const prev = out[out.length - 1];
    if (prev && prev.role === m.role) out[out.length - 1] = { role: m.role, content: [...toBlocks(prev.content), ...toBlocks(m.content)] };
    else out.push({ role: m.role, content: m.content });
  });
  return out;
}

// 一度きりの掃除：全部屋の履歴・記録帳・回想録からテキスト化された呼び出しを除去し、中身を手控えとして救出する計画を立てる。
// data は { rooms, threads, memories, retrospects, notes }。データは書き換えず、適用後の値と集計を返す。
function planTextualJotCleanup({ rooms, threads, memories, retrospects, notes }) {
  const roomName = (id) => (rooms.find((r) => r.id === id) || {}).name || "（不明な部屋）";
  const perRoom = {}; // roomId → 除去箇所数
  const known = {}; // roomId → 既にある手控え本文の Set
  notes.forEach((n) => { (known[n.roomId] = known[n.roomId] || new Set()).add(n.text); });
  const rescued = [];
  let skippedDup = 0;
  const summary = { messages: 0, droppedMessages: 0, memories: 0, retrospects: 0, rescued: 0, skippedDup: 0 };

  function rescue(roomId, texts, createdAt) {
    texts.forEach((text) => {
      const set = (known[roomId] = known[roomId] || new Set());
      if (set.has(text)) { skippedDup++; return; }
      set.add(text);
      rescued.push({ id: uid(), roomId, text, createdAt: createdAt || nowISO() });
    });
  }

  const nextThreads = threads.map((t) => {
    let changed = false;
    const messages = [];
    (t.messages || []).forEach((m) => {
      if (m.role !== "assistant") { messages.push(m); return; }
      const r = stripTextualJotCalls(m.content);
      if (r.removed === 0) { messages.push(m); return; }
      changed = true;
      summary.messages++;
      perRoom[t.roomId] = (perRoom[t.roomId] || 0) + r.removed;
      rescue(t.roomId, r.jotted, m.ts);
      if (hasVisibleText(r.content)) messages.push({ ...m, content: r.content });
      else summary.droppedMessages++; // 本文が呼び出しだけだった発言は消す（空の assistant は送信時にも落とされる）
    });
    return changed ? { ...t, messages } : t;
  });

  const nextMemories = memories.map((m) => {
    const r = extractTextualJotCalls(m.text);
    if (r.removed === 0) return m;
    summary.memories++;
    perRoom[m.roomId] = (perRoom[m.roomId] || 0) + r.removed;
    rescue(m.roomId, r.jotted, m.createdAt);
    return { ...m, text: r.text };
  });

  const nextRetrospects = { ...retrospects };
  Object.entries(retrospects || {}).forEach(([roomId, rs]) => {
    const r = extractTextualJotCalls(rs && rs.text);
    if (r.removed === 0) return;
    summary.retrospects++;
    perRoom[roomId] = (perRoom[roomId] || 0) + r.removed;
    rescue(roomId, r.jotted, rs.updatedAt);
    nextRetrospects[roomId] = { ...rs, text: r.text };
  });

  summary.rescued = rescued.length;
  summary.skippedDup = skippedDup;
  summary.rooms = Object.entries(perRoom).map(([id, count]) => ({ name: roomName(id), count }));
  summary.total = Object.values(perRoom).reduce((a, b) => a + b, 0);
  // 部屋のシステムプロンプトに呼び出し書式の例が書かれていないか（自動では直さず、名前だけ知らせる）
  summary.promptRooms = rooms
    .filter((r) => typeof r.systemPrompt === "string" && /<[\w.:-]*invoke\b|<[\w.:-]*function_calls\b/.test(r.systemPrompt))
    .map((r) => r.name);
  return {
    summary,
    next: { threads: nextThreads, memories: nextMemories, retrospects: nextRetrospects, notes: [...notes, ...rescued] },
  };
}

function buildThreadText(building, room, thread) {
  const parts = [`栞 ─ ${building.name} / ${room.name}\n${thread.title}（${thread.frozenDate}）`];
  thread.messages.forEach((m) => {
    // 時刻のある発言だけ頭に [11/17 21:24] を付ける（時刻のない古い発言は今までどおり）
    const stamp = hasMsgTime(m) ? `${formatLogStamp(m.ts)} ` : "";
    if (m.role === "user") {
      parts.push(`${stamp}【多恵子】\n${extractPlainText(m.content)}`);
      return;
    }
    let body = assistantLogBody(m);
    const citations = Array.isArray(m.content)
      ? m.content.filter((b) => b.type === "text").flatMap((b) => b.citations || [])
      : [];
    if (citations.length > 0) body += "\n" + citations.map((c) => `出典: ${c.url}`).join("\n");
    parts.push(`${stamp}【${room.name}】\n${body}`);
  });
  return parts.join("\n\n") + "\n";
}

// テキストログ用のモデル発言本文。書き付けた箇所（jot_note の tool_use）に「（手控え：〈内容〉）」を1行入れる。
// 位置の分からない書き付け（構造で保存する前の発言・テキスト化された呼び出しから回収したもの）は末尾に入れる
function assistantLogBody(m) {
  const jotLine = (t) => `（手控え：${t}）`;
  const leftover = Array.isArray(m.jotted) ? [...m.jotted] : [];
  const takeLeftover = (t) => { const i = leftover.indexOf(t); if (i !== -1) leftover.splice(i, 1); };
  const lines = [];
  if (Array.isArray(m.content)) {
    const results = {};
    m.content.forEach((b) => { if (b.type === "tool_result") results[b.tool_use_id] = b; });
    let buf = [];
    const flush = () => { const t = buf.join("\n").trim(); if (t) lines.push(t); buf = []; };
    m.content.forEach((b) => {
      if (b.type === "text") { buf.push(b.text); return; }
      if (b.type !== "tool_use" || b.name !== JOT_TOOL.name) return;
      const r = results[b.id];
      const text = normalizeJotText(b.input && b.input.text);
      if (!r || r.is_error || !text) return; // 保存できなかった書き付けは載せない
      flush();
      lines.push(jotLine(text));
      takeLeftover(text);
    });
    flush();
  } else {
    lines.push(extractPlainText(m.content));
  }
  leftover.forEach((t) => lines.push(jotLine(t)));
  return lines.join("\n");
}

// ConfirmDialog は message を HTML として描くので、利用者の文章を差し込むときはエスケープする
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 冒頭 n 字（超えたら「…」）。改行は空白にまとめる
function excerpt(text, n) {
  const chars = Array.from(String(text).replace(/\s+/g, " ").trim());
  return chars.length > n ? chars.slice(0, n).join("") + "…" : chars.join("");
}

function roomPreview(systemPrompt) {
  const firstLine = (systemPrompt || "").split("\n").find((l) => l.trim().length > 0) || "";
  return firstLine.length > 20 ? firstLine.slice(0, 20) + "…" : firstLine;
}

/* ===== 通訳層(プロバイダ抽象) ===== */

class ShosaiError extends Error {
  constructor(message, extra = {}) {
    super(message);
    this.raw = extra.raw;
    this.status = extra.status;
  }
}

function buildApiError(status, json, model) {
  const raw = json ? JSON.stringify(json, null, 2) : "";
  const msg = json && json.error && json.error.message ? json.error.message : "";
  if (status === 404) {
    return new ShosaiError(`このモデルIDが見つからない。棟の設定を確認してほしい。(${model})`, { raw, status });
  }
  if (status === 529 || status === 429) {
    return new ShosaiError("向こうが混んでいるだけで、こちらの問題ではない。少し待ってもう一度。", { raw, status });
  }
  if (status === 400 && /token|too long|context/i.test(msg)) {
    return new ShosaiError("このスレッドが長くなった。記憶を綴じて、新しいスレッドで続けるのがよさそう。", { raw, status });
  }
  return new ShosaiError(`接続に失敗した。ネットワークか、APIキーを確認してほしい。(${status})`, { raw, status });
}

const STREAM_BROKEN_MESSAGE = "途中で筆が止まった。もう一度送ってみてほしい。";
const TOOL_USE_BLOCK_TYPES = new Set(["tool_use", "server_tool_use", "mcp_tool_use"]);
// thread.messages に保存しない assistant ブロックの種類（理由は sendToModel の保存箇所を参照）
const UNSAVED_BLOCK_TYPES = new Set(["thinking", "redacted_thinking"]);
// ストリーミングで入力JSONが壊れていた tool_use ブロック（API に送り返すブロックに印を付けないため WeakSet で持つ）
const BROKEN_TOOL_INPUTS = new WeakSet();

/* ----- usage の扱い ----- */

// message_start の usage に message_delta の usage を重ねる。入れ子（cache_creation 等）も同じ規則で重ねる。
// 後から来た null / undefined、および「前に値があるところへの 0」では上書きしない
function mergeUsage(base, next) {
  const out = { ...(base || {}) };
  Object.entries(next || {}).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    if (typeof v === "object" && !Array.isArray(v)) {
      out[k] = mergeUsage(out[k] && typeof out[k] === "object" ? out[k] : {}, v);
      return;
    }
    if (v === 0 && typeof out[k] === "number" && out[k] !== 0) return;
    out[k] = v;
  });
  return out;
}

// 継続ループ（tool_use・pause_turn）で複数回リクエストしたターンの usage を合計する。数値は足し、入れ子は再帰で足す。
// 数値以外（service_tier 等の文字列）は後の値を採る
function sumUsage(a, b) {
  if (!a) return b ? { ...b } : a;
  if (!b) return { ...a };
  const out = { ...a };
  Object.entries(b).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    if (typeof v === "number") out[k] = (typeof out[k] === "number" ? out[k] : 0) + v;
    else if (typeof v === "object" && !Array.isArray(v)) out[k] = sumUsage(out[k] && typeof out[k] === "object" ? out[k] : null, v);
    else out[k] = v;
  });
  return out;
}

// usage 表示の「書」（キャッシュ書き込み）。cache_creation_input_tokens を使い、
// 無い（または 0 なのに内訳には値がある）場合は cache_creation の 5m と 1h の合計を使う
function cacheWriteTokens(usage) {
  if (!usage) return 0;
  const total = typeof usage.cache_creation_input_tokens === "number" ? usage.cache_creation_input_tokens : 0;
  const cc = usage.cache_creation && typeof usage.cache_creation === "object" ? usage.cache_creation : null;
  const breakdown = cc ? (cc.ephemeral_5m_input_tokens || 0) + (cc.ephemeral_1h_input_tokens || 0) : 0;
  return total > 0 ? total : breakdown;
}

   over があるモデル（Haiku 5.5）は、1リクエストの入力合計（素＋書＋読）が threshold を超えたら、そのリクエスト全体を over.rates で計算する。
   ids は正規化（normalizeModelId）したモデルIDで照合する。日付付きID・ドット表記などの表記ゆれは正規化で同じ行に寄る。 */
const DEFAULT_PRICE_TABLE = [

];
const PRICE_FIELDS = [
  { k: "input", label: "入力" },
  { k: "write5m", label: "5分書き込み" },
  { k: "write1h", label: "1時間書き込み" },
  { k: "read", label: "キャッシュ読み" },
  { k: "output", label: "出力" },
];
// 「書」が 0 で記録されていた不具合（message_delta の 0 で上書き）の修正より前の発言。帳簿の注記にだけ使う
const USAGE_WRITE_FIX_AT = "2026-11-18T00:00:00Z";
const SPEND_KINDS = [
  { k: "send", label: "通常送信" },
  { k: "bundle", label: "綴じ" },
  { k: "weave", label: "編み" },
  { k: "discard", label: "破棄" },
];
const EMPTY_LEDGERS = { threads: {}, rooms: {} };

// モデルIDの表記ゆれを寄せる：大文字小文字・[1m] 等の添え字・プロバイダ接頭辞・日付／版の接尾辞・数字間のドット
function normalizeModelId(id) {
  let s = String(id || "").trim().toLowerCase();
  s = s.replace(/\[[^\]]*\]$/, "");
  s = s.replace(/^(?:(?:us|eu|apac|global|jp|au)\.)?(?:anthropic[./])?/, "");
  s = s.replace(/^models\//, "");
  s = s.replace(/(\d)\.(\d)/g, "$1-$2");
  s = s.replace(/(?:[-@]\d{8})?(?:-v\d+(?::\d+)?)?$/, "");
  s = s.replace(/-latest$/, "");
  return s;
}

// 保存されている単価表を読み込む。初期値に後から足された行（key で判定）は末尾に補う
function loadPriceTable() {
  const stored = loadJSON(K.prices, null);
  if (!Array.isArray(stored)) return DEFAULT_PRICE_TABLE;
  const keys = new Set(stored.map((r) => r && r.key));
  return [...stored.filter((r) => r && r.rates), ...DEFAULT_PRICE_TABLE.filter((r) => !keys.has(r.key))];
}

function findPriceRow(model, table) {
  const id = normalizeModelId(model);
  if (!id) return null;
  return table.find((r) => (r.ids || []).some((x) => normalizeModelId(x) === id)) || null;
}

// 1回のリクエストの金額（USD）。単価表に無いモデルなら null
function requestCost(usage, model, ttl, table) {
  if (!usage) return null;
  const row = findPriceRow(model, table);
  if (!row) return null;
  const n = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
  const raw = n(usage.input_tokens);
  const read = n(usage.cache_read_input_tokens);
  const out = n(usage.output_tokens); // 思考トークンも含まれる
  const cc = usage.cache_creation && typeof usage.cache_creation === "object" ? usage.cache_creation : {};
  let w5 = n(cc.ephemeral_5m_input_tokens);
  let w1 = n(cc.ephemeral_1h_input_tokens);
  const write = cacheWriteTokens(usage);
  // 内訳が無い（足りない）分は、その部屋の TTL 設定のほうに入れる
  if (w5 + w1 < write) {
    if (ttl === "1h") w1 += write - w5 - w1; else w5 += write - w5 - w1;
  }
  const rates = row.over && raw + w5 + w1 + read > row.over.threshold ? row.over.rates : row.rates;
  const r = (k) => n(Number(rates[k]));
  const c = {
    input: (raw * r("input")) / 1e6,
    write: (w5 * r("write5m") + w1 * r("write1h")) / 1e6,
    read: (read * r("read")) / 1e6,
    output: (out * r("output")) / 1e6,
  };
  c.total = c.input + c.write + c.read + c.output;
  return c;
}

// 発言1件の金額。複数回リクエストしたターン（rounds）は各回を個別に計算して足す。
// どれか1回でも単価未設定なら { unpriced: true }（金額は計上しない）。usage の無い古い発言は null
function messageCost(m, fallbackModel, ttl, table) {
  if (!m || !m.usage) return null;
  const rounds = Array.isArray(m.rounds) && m.rounds.length > 0 ? m.rounds : [{ model: m.model, usage: m.usage }];
  let total = 0;
  for (const r of rounds) {
    const c = requestCost(r.usage, r.model || m.model || fallbackModel, ttl, table);
    if (!c) return { unpriced: true };
    total += c.total;
  }
  return { total };
}

function formatUSD(x) {
  const v = typeof x === "number" && isFinite(x) ? x : 0;
  return `$${v < 1 ? v.toFixed(4) : v.toFixed(2)}`;
}

// 保存済みの発言の usage から帳簿を作る（帳簿の無い既存スレッドを初めて開いたときに一度だけ）。
// モデルは発言に保存されていればそれ、無ければその時点の棟のモデルで代用して記録する
function ledgerFromMessages(thread, fallbackModel) {
  const entries = [];
  (thread.messages || []).forEach((m) => {
    if (!m || m.role !== "assistant" || !m.usage) return;
    const rounds = Array.isArray(m.rounds) && m.rounds.length > 0 ? m.rounds : [{ model: m.model, usage: m.usage }];
    rounds.forEach((r) => entries.push({
      ts: hasMsgTime(m) ? m.ts : null, kind: "send", model: r.model || m.model || fallbackModel || null, usage: r.usage, fromHistory: true,
    }));
  });
  return entries;
}

// 帳簿の集計。合計・種別ごと・項目ごと・未計上の件数とモデル・古い発言の注記の要否
function summarizeLedger(entries, ttl, table) {
  const sum = { total: 0, byKind: {}, byCat: { input: 0, write: 0, read: 0, output: 0 }, counts: {}, unpriced: 0, unpricedModels: [], legacyZeroWrite: false };
  SPEND_KINDS.forEach(({ k }) => { sum.byKind[k] = 0; sum.counts[k] = 0; });
  (entries || []).forEach((e) => {
    if (!e || !e.usage) return;
    const kind = sum.byKind[e.kind] !== undefined ? e.kind : "send";
    sum.counts[kind]++;
    if (e.fromHistory && cacheWriteTokens(e.usage) === 0 && (!e.ts || e.ts < USAGE_WRITE_FIX_AT)) sum.legacyZeroWrite = true;
    const c = requestCost(e.usage, e.model, ttl, table);
    if (!c) {
      sum.unpriced++;
      const id = e.model || "（モデル不明）";
      if (!sum.unpricedModels.includes(id)) sum.unpricedModels.push(id);
      return;
    }
    sum.total += c.total;
    sum.byKind[kind] += c.total;
    Object.keys(sum.byCat).forEach((k) => { sum.byCat[k] += c[k]; });
  });
  return sum;
}

function normalizeLedgers(data) {
  const ok = (o) => (o && typeof o === "object" && !Array.isArray(o) ? o : {});
  const src = ok(data);
  return { threads: { ...ok(src.threads) }, rooms: { ...ok(src.rooms) } };
}

// SSE（stream: true）を読み、非ストリーミング時と同じ形の { content, stop_reason, usage } を組み立てる。
// text_delta のフラグメントだけを onDelta に流す。途中で切れた・壊れた場合は ShosaiError（部分出力は返さない）。
async function readAnthropicStream(res, onDelta) {
  const content = [];
  const partialJson = {}; // index → 連結中の input_json_delta
  let usage = {};
  let model = null; // 応答したモデル（金額の計算用）
  let stopReason = null;
  let finished = false;

  function handleEvent(data) {
    switch (data.type) {
      case "message_start":
        // 調査用：届いた usage をそのまま出す（「書」がどのフィールドから来るかの確認）
        console.log("[書斎] raw usage message_start", JSON.stringify((data.message && data.message.usage) || null));
        usage = mergeUsage({}, (data.message && data.message.usage) || {});
        if (data.message && data.message.model) model = data.message.model;
        break;
      case "content_block_start": {
        const block = { ...data.content_block };
        // thinking ブロックは本文・署名ともデルタで届く。再送時に必須なので文字列で初期化しておく
        if (block.type === "thinking") {
          if (typeof block.thinking !== "string") block.thinking = "";
          if (typeof block.signature !== "string") block.signature = "";
        }
        content[data.index] = block;
        break;
      }
      case "content_block_delta": {
        const block = content[data.index];
        const delta = data.delta || {};
        if (!block) break;
        if (delta.type === "text_delta") {
          block.text = (block.text || "") + delta.text;
          if (delta.text) onDelta(delta.text);
        } else if (delta.type === "input_json_delta") {
          partialJson[data.index] = (partialJson[data.index] || "") + (delta.partial_json || "");
        } else if (delta.type === "thinking_delta") {
          block.thinking = (block.thinking || "") + (delta.thinking || ""); // 表示には流さない
        } else if (delta.type === "signature_delta") {
          block.signature = (block.signature || "") + (delta.signature || "");
        } else if (delta.type === "citations_delta") {
          block.citations = [...(block.citations || []), delta.citation];
        }
        break;
      }
      case "content_block_stop": {
        const block = content[data.index];
        if (block && TOOL_USE_BLOCK_TYPES.has(block.type)) {
          const raw = partialJson[data.index] || "";
          if (raw !== "") {
            try {
              block.input = JSON.parse(raw);
            } catch (e) {
              // 入力が壊れていてもストリーム全体は止めず、tool_result で is_error を返す
              console.warn("[書斎] tool_use の入力JSONを読めなかった", raw);
              block.input = {};
              BROKEN_TOOL_INPUTS.add(block);
            }
          } else if (!block.input) block.input = {};
        }
        break;
      }
      case "message_delta":
        if (data.delta && data.delta.stop_reason !== undefined) stopReason = data.delta.stop_reason;
        console.log("[書斎] raw usage message_delta", JSON.stringify(data.usage || null));
        // message_delta の usage（出力系・累積値）を message_start の入力系に重ねる。null・undefined・後から来た 0 では上書きしない
        usage = mergeUsage(usage, data.usage);
        break;
      case "message_stop":
        finished = true;
        break;
      case "error": {
        const msg = data.error && data.error.type === "overloaded_error"
          ? "向こうが混んでいるだけで、こちらの問題ではない。少し待ってもう一度。"
          : STREAM_BROKEN_MESSAGE;
        throw new ShosaiError(msg, { raw: JSON.stringify(data, null, 2) });
      }
      default: // ping など
        break;
    }
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (value) buffer += decoder.decode(value, { stream: true });
      if (done) buffer += decoder.decode() + "\n\n";
      buffer = buffer.replace(/\r\n?/g, "\n");
      let sep;
      while ((sep = buffer.indexOf("\n\n")) !== -1) {
        const chunk = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);
        const dataLines = chunk.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, ""));
        if (dataLines.length === 0) continue;
        handleEvent(JSON.parse(dataLines.join("\n")));
      }
      if (done) break;
    }
  } catch (e) {
    reader.cancel().catch(() => {}); // 既にエラーになったストリームでは cancel 自体が reject する
    if (e instanceof ShosaiError) throw e;
    throw new ShosaiError(STREAM_BROKEN_MESSAGE, { raw: String(e) });
  }
  if (!finished) {
    throw new ShosaiError(STREAM_BROKEN_MESSAGE, { raw: "message_stop を受け取る前にストリームが終わった" });
  }
  return { content: content.filter(Boolean), stop_reason: stopReason, usage, model };
}

// Anthropic Messages APIをブラウザから直接呼ぶ唯一の窓口
// body は buildRequestBody で組み立てたものをそのまま送る
// onDelta が渡されたときだけストリーミングで受け取る（通常送信のみ）。返り値の形はどちらも同じ。
async function anthropicMessages({ apiKey, body, onDelta }) {
  const streaming = typeof onDelta === "function";
  if (streaming) body = { ...body, stream: true };
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new ShosaiError("接続に失敗した。ネットワークか、APIキーを確認してほしい。", { raw: String(e) });
  }

  if (!res.ok) {
    const errJson = await res.json().catch(() => null);
    throw buildApiError(res.status, errJson, body.model);
  }
  const json = streaming ? await readAnthropicStream(res, onDelta) : await res.json().catch(() => null);
  if (!json) throw new ShosaiError(STREAM_BROKEN_MESSAGE, { raw: "応答を読めなかった" });
  if (json.usage) {
    // 非ストリーミング（綴じ・編み）は応答の usage をそのまま使う。調査用に生の値を出す
    if (!streaming) console.log("[書斎] raw usage (non-stream)", JSON.stringify(json.usage));
    console.log("[書斎] usage", json.usage, "書", cacheWriteTokens(json.usage));
  }
  return json;
}

// 棟のプロバイダを見て呼び先を切り替える。現時点ではanthropicのみ実装。
// 将来 provider: "gemini" 等を追加する際はここに分岐を足すだけでよい。
async function callModel({ building, apiKey, body, onDelta }) {
  switch (building.provider) {
    case "anthropic":
    default:
      return anthropicMessages({ apiKey, body, onDelta });
  }
}

// クライアントツールを1つ実行し、tool_result ブロックを返す。jot_note の本文は jotted に積む。
function runClientTool(block, jotted) {
  const result = (content, isError) => (isError
    ? { type: "tool_result", tool_use_id: block.id, content, is_error: true }
    : { type: "tool_result", tool_use_id: block.id, content });
  if (block.name !== JOT_TOOL.name) return result(`${block.name} というツールはこの部屋にない。`, true);
  if (BROKEN_TOOL_INPUTS.has(block)) return result("入力のJSONを読めなかったため、保存できなかった。", true);
  const text = normalizeJotText(block.input && block.input.text);
  if (!text) return result("書き付ける内容（text）が空だったため、保存できなかった。", true);
  jotted.push(text);
  return result("保存しました", false);
}

// 応答を最後まで受け取るための継続ループ。通常送信・編集＆再送信・綴じ・編みの全経路がここを通る。
// ・pause_turn（検索の途中で一時返却）なら、返ってきた content を assistant として足して同じボディで再送する。
// ・tool_use（クライアントツール呼び出し）なら、全 tool_use を実行して jot_note の本文を jotted に積み、
//   assistant（thinking を含むそのままの content）と user（全 tool_use_id への tool_result を1つにまとめたもの）を足して再送する。
//   tool_use での継続は TOOL_LOOP_MAX 回まで。超えたら打ち切り、truncated: true を返す（呼び出し側でエラー表示）。
// 全周回の content を順に連結して返す。usage は全周回の合計（sumUsage）、stop_reason は最終周のもの。jotted はこの送信中に書き付けられた本文の配列。
// 途中でエラーになった場合も、それまでの jotted を error.jotted に載せて投げ直す（記憶は記憶として残すため）。
// onDelta（任意）は各周回にそのまま渡す。tool_use を挟んだ続きは空行を1つ挟んで同じ流れとして文字が増えていく。
// onRound（任意）は usage が返ってきた周ごとに { model, usage } で呼ぶ（支出の帳簿用。途中でエラーになっても、それまでの周は呼ばれている）。
// rounds は全周の { model, usage }（各回を個別に金額計算するため）、model は最終周を返したモデル。
async function callModelWithContinuation({ building, apiKey, body, onDelta, onRound }) {
  const content = [];
  const rounds = [];
  const jotted = [];
  let json;
  let totalUsage = null;
  let toolRounds = 0;
  let truncated = false;
  let wroteText = false;
  let needSep = false;
  const delta = typeof onDelta === "function"
    ? (t) => {
      if (!t) return;
      if (needSep && wroteText) onDelta("\n\n");
      needSep = false;
      wroteText = true;
      onDelta(t);
    }
    : undefined;
  try {
    for (let round = 1; ; round++) {
      json = await callModel({ building, apiKey, body, onDelta: delta });
      console.log(`[書斎] round ${round} stop_reason`, json.stop_reason, json.usage);
      // 各周の「書」を先に確定させてから足す（周ごとに cache_creation_input_tokens の有無が違っても取りこぼさない）
      if (json.usage) totalUsage = sumUsage(totalUsage, { ...json.usage, cache_creation_input_tokens: cacheWriteTokens(json.usage) });
      if (json.usage) {
        const r = { model: json.model || body.model, usage: json.usage };
        rounds.push(r);
        if (typeof onRound === "function") {
          try { onRound(r); } catch (err) { console.warn("[書斎] 支出の記録に失敗", err); }
        }
      }
      const roundContent = json.content || [];
      content.push(...roundContent);
      // 再送用：空の text ブロックはAPIに弾かれるので落とす。thinking 等はそのまま（除去するとAPIエラー）
      const resendContent = roundContent.filter((b) => !(b.type === "text" && !b.text));

      let followUp;
      if (json.stop_reason === "pause_turn") {
        followUp = [{ role: "assistant", content: resendContent }];
      } else if (json.stop_reason === "tool_use") {
        // 1周に複数の tool_use があり得る。全 tool_use_id に tool_result を返すこと（欠けるとAPIエラー）
        const uses = roundContent.filter((b) => b.type === "tool_use");
        if (uses.length === 0) break; // tool_use ブロックが無い tool_use 停止は継続しようがない
        const toolResults = uses.map((b) => runClientTool(b, jotted));
        // 履歴に構造のまま残すため、返した tool_result も並び順どおり content に差し込む（打ち切る場合も、書き付けは実行済みなので残す）
        content.push(...toolResults);
        toolRounds++;
        if (toolRounds > TOOL_LOOP_MAX) {
          console.warn(`[書斎] tool_use の継続が上限（${TOOL_LOOP_MAX}回）に達したため打ち切り`);
          truncated = true;
          break;
        }
        followUp = [
          { role: "assistant", content: resendContent },
          { role: "user", content: toolResults },
        ];
      } else {
        break;
      }

      if (round >= CONTINUATION_MAX_ROUNDS) {
        console.warn(`[書斎] ${json.stop_reason} の継続が上限に達したため打ち切り`);
        truncated = true;
        break;
      }
      needSep = json.stop_reason === "tool_use";
      body = { ...body, messages: [...body.messages, ...followUp] };
    }
  } catch (e) {
    if (jotted.length > 0) e.jotted = jotted;
    throw e;
  }
  return { content, usage: totalUsage || json.usage, stop_reason: json.stop_reason, jotted, truncated, rounds, model: json.model || body.model };
}

// 「記憶を綴じる」「回想録を編む」用：可視テキストが無ければ自動で1回だけ再試行する。
// 2回とも空なら最後の結果をそのまま返し、空応答のエラー表示は呼び出し側の既存判定に任せる。
// 通常会話の送信には使わないこと（そちらはエラー表示→ユーザーが再送）。
// effort に対応しないモデル（Haiku 4.5 など）で output_config が400になった場合は、effort を外して送り直す。
async function callModelRetryOnEmpty(args, onJotted) {
  let json;
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      try {
        json = await callModelWithContinuation(args);
      } catch (e) {
        if (!(e.status === 400 && args.body.output_config && /effort|output_config/i.test(e.raw || ""))) throw e;
        console.warn("[書斎] このモデルは effort に対応していないため、外して送り直す", e.raw);
        const { output_config, ...bodyWithoutEffort } = args.body;
        args = { ...args, body: bodyWithoutEffort };
        json = await callModelWithContinuation(args);
      }
    } catch (e) {
      if (e.jotted && onJotted) onJotted(e.jotted);
      throw e;
    }
    if (json.jotted.length > 0 && onJotted) onJotted(json.jotted);
    if (hasVisibleText(finalizeAssistantContent(json.content).content)) return json;
    console.warn(`[書斎] 空応答（${attempt}回目）stop_reason`, json.stop_reason, json.usage);
  }
  return json;
}

// 通常送信と「記憶を綴じる」で共用するリクエストボディ。
// tools・system・履歴をここ一か所で組み立てることで、両者のキャッシュのプレフィックスを一致させる。
// 綴じる用に別実装を書かないこと。
// options: maxTokens / toolChoice（tools がある時だけ付与）/ extraMessages（履歴の後ろに足す。キャッシュ境界は付けない）
//          / block1Only（system をブロック1だけにする。「回想録を編む」用）
//          / effort（output_config.effort。綴じ・編みだけが "low" を渡す。通常送信には付けない）
//          / block2Text（block2 の本文。resolveBlock2 で据え置いたものを渡す。省略時はその場で組み立てる）
//          thinking パラメータは一切送らない（Opus 5.5 等では disabled も enabled も400になる）
function buildRequestBody({ building, room, memories, retrospects, notes, frozenDate }, messagesToSend, options = {}) {
  // 1リクエスト内のブレークポイントは全て同一TTLに揃える（block1・block2・履歴の最終メッセージの計3つ）
  const ttl = room.cacheTtl === "1h" ? "1h" : undefined; // "5m"時はttl省略（API既定が5分）
  const cc = ttl ? { type: "ephemeral", ttl } : { type: "ephemeral" };
  const block1 = { type: "text", text: room.systemPrompt, cache_control: cc };
  const system = [block1];
  if (!options.block1Only) {
    const block2Text = typeof options.block2Text === "string" ? options.block2Text : buildBlock2(room, memories, retrospects, notes, frozenDate);
    system.push({ type: "text", text: block2Text, cache_control: cc });
  }
  // tools の構成は部屋設定だけで決まる（通常送信・綴じ・編むで一致させ、キャッシュのプレフィックスを揃える）
  const toolList = [];
  if (room.webSearch) toolList.push({ type: "web_search_20250305", name: "web_search", max_uses: WEB_SEARCH_MAX_USES });
  if (room.jotNote) toolList.push(JOT_TOOL);
  const tools = toolList.length > 0 ? toolList : undefined;
  // 履歴の thinking / redacted_thinking は送らない（この改修より前に保存された発言にも残っているため、送信時にも落とす）
  // 履歴に残ったテキスト化された jot_note 呼び出しも送らない（モデルが真似をして、本物のツール呼び出しをしなくなるため）
  // 過去に保存されてしまった空の assistant 発言は送らない（APIに弾かれるため）
  const sendable = messagesToSend
    .map((m) => {
      if (m.role !== "assistant") return m;
      const content = Array.isArray(m.content) ? stripThinkingBlocks(m.content) : m.content;
      return { ...m, content: stripTextualJotCalls(content).content };
    })
    .filter((m) => m.role !== "assistant" || hasVisibleText(m.content));
  // 保存した tool_use / tool_result を API の形に展開する。jot_note を tools に送らない部屋では除去して前後の本文を結合する
  const expanded = mergeSameRoleMessages(sendable.flatMap((m) => (m.role === "assistant" ? expandToolTurns(m, !!room.jotNote) : [m])));
  const payloadMessages = expanded.map((m, i) => {
    if (i !== expanded.length - 1) {
      return { role: m.role, content: m.content };
    }
    // 履歴の最後のメッセージにキャッシュ境界を置く。保存形式は変えない。
    if (typeof m.content === "string") {
      return { role: m.role, content: [{ type: "text", text: m.content, cache_control: cc }] };
    }
    // 配列の場合（assistant発言など）は最後のtextブロックに付与
    const content = m.content.map((b) => ({ ...b }));
    for (let j = content.length - 1; j >= 0; j--) {
      if (content[j].type === "text") { content[j].cache_control = cc; break; }
    }
    return { role: m.role, content };
  });
  if (options.extraMessages) payloadMessages.push(...options.extraMessages);

  const body = {
    model: building.model,
    max_tokens: options.maxTokens || MAX_TOKENS,
    messages: payloadMessages,
    system,
  };
  if (tools) body.tools = tools;
  if (tools && options.toolChoice) body.tool_choice = options.toolChoice;
  if (options.effort) body.output_config = { effort: options.effort };
  return body;
}

// 履歴から thinking / redacted_thinking ブロックを取り除く
function stripThinkingBlocks(content) {
  return content.filter((b) => b.type !== "thinking" && b.type !== "redacted_thinking");
}

function buildBlock2(room, memories, retrospects, notes, frozenDate) {
  // 未編み記録は件数制限なしで全件注入する。編み済み（woven）は回想録に統合済みなので個別注入から外れる。
  const retrospect = retrospects && retrospects[room.id];
  const unwoven = memories
    .filter((m) => m.roomId === room.id && !m.woven)
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const memoryText =
    unwoven.length > 0
      ? unwoven.map((m) => `・${extractTextualJotCalls(m.text).text}`).join("\n")
      : retrospect
        ? "直近の記録はまだない。"
        : "まだ記録はない。今日が最初の日ということ。";
  const retrospectText = retrospect ? `【回想録 ─ 遠い記憶】\n${extractTextualJotCalls(retrospect.text).text}\n\n` : "";
  // 手控え（会話中にモデル本人が書き付けたもの）。回想録には編まれず、消されるまで残る。0件ならセクションごと出さない。
  const roomNotes = (notes || [])
    .filter((n) => n.roomId === room.id)
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const notesText = roomNotes.length > 0
    ? `【手控え ─ 会話の途中で自分が書き付けたこと】\n${roomNotes.map((n) => `・${formatYMD(n.createdAt)}：${n.text}`).join("\n")}\n\n`
    : "";
  return `${retrospectText}${notesText}【記録帳】\n${memoryText}\n\n【この部屋の日付】\n${frozenDate}（スレッド作成日で凍結。「今日の日付」として扱ってよいが、厳密な現在時刻は不明であることを知っておくこと）`;
}

/* ----- block2 の据え置き -----
   block2（回想録・手控え・記録帳）は system の2つ目で、会話履歴より前にある。中身が1文字でも変わると、
   それ以降（会話全体）のキャッシュが無効になって書き直しになる。そこで、スレッドごとに前回送った block2 を控えておき、
   次のときだけ作り直す。それ以外（ツールループの途中・キャッシュが生きている間の通常送信・綴じ）は控えをそのまま送る。
   ・新しいスレッド（控えが無い）
   ・前回のリクエストから部屋の TTL 以上経った（どうせキャッシュは切れている）
   ・綴じ・編みのあと／記録帳で記録・手控えを編集・追加・削除したとき（invalidateBlock2 で控えを捨てる）
   書き付けた手控えは保存・表示は即時、block2 への反映だけが上の時機まで遅れる。 */
function cacheTtlMs(room) {
  return room.cacheTtl === "1h" ? 60 * 60 * 1000 : 5 * 60 * 1000;
}

// このスレッドで送る block2 を返し、送信時刻を控えに記録する
function resolveBlock2({ room, thread, memories, retrospects, notes }) {
  const snaps = loadJSON(K.block2Snapshots, {});
  const snap = snaps[thread.id];
  const now = Date.now();
  let reason = null;
  if (!snap || snap.roomId !== room.id || typeof snap.text !== "string") reason = "控えなし（新しいスレッド・作り直し後）";
  else if (!(now - new Date(snap.lastSentAt).getTime() < cacheTtlMs(room))) reason = "TTL 経過";
  const text = reason ? buildBlock2(room, memories, retrospects, notes, thread.frozenDate) : snap.text;
  if (reason) console.log(`[書斎] block2 を作り直した（${reason}）`);
  else console.log("[書斎] block2 は前回送ったものをそのまま使う");
  snaps[thread.id] = { roomId: room.id, text, lastSentAt: new Date(now).toISOString() };
  saveJSON(K.block2Snapshots, snaps);
  return text;
}

// 控えを捨てる（次の送信で作り直す）。roomId を渡せばその部屋のスレッドだけ、省略で全部
function invalidateBlock2(roomId) {
  if (roomId === undefined) { localStorage.removeItem(K.block2Snapshots); return; }
  const snaps = loadJSON(K.block2Snapshots, {});
  Object.keys(snaps).forEach((id) => { if (snaps[id] && snaps[id].roomId === roomId) delete snaps[id]; });
  saveJSON(K.block2Snapshots, snaps);
}

// マークダウンの本文。markdownRenderer が無い（ライブラリを読めなかった）ときはプレーン表示
function MarkdownText({ text }) {
  const html = React.useMemo(() => (markdownRenderer ? markdownRenderer(text) : null), [text]);
  if (html === null) return <div>{text}</div>;
  return <div className="md" dangerouslySetInnerHTML={{ __html: html }} />;
}

// markdown: true はモデルの発言だけ。自分の発言はプレーンテキストのまま
function MessageContent({ content, markdown = false }) {
  const body = (text) => (markdown ? <MarkdownText text={text} /> : <div>{text}</div>);
  if (typeof content === "string") {
    return body(content);
  }
  if (!Array.isArray(content)) return null;
  // tool_use / tool_result は表示しない。ツールを挟んで分かれた前後の本文は空行1つでつなぐ（ストリーミング中の見た目と同じ）
  const textBlocks = joinAcrossToolBoundaries(content).filter((b) => b.type === "text");
  const text = textBlocks.map((b) => b.text).join("");
  const citations = textBlocks.flatMap((b) => b.citations || []);
  return (
    <div>
      {body(text)}
      {citations.length > 0 && (
        <div className="citations">
          {citations.map((c, i) => (
            <a key={i} href={c.url} target="_blank" rel="noopener noreferrer">{c.title || c.url}</a>
          ))}
        </div>
      )}
    </div>
  );
}

// モデル発言の下に出すキャッシュ状況の一行。usageの無い過去メッセージには何も出さない。
// stopReason が end_turn 以外のときだけ、行頭にその値を添える。cost（messageCost の結果）があれば末尾に金額を添える。
function UsageLine({ usage, stopReason, cost }) {
  if (!usage) return null;
  const fmt = (n) => (n || 0).toLocaleString();
  const read = usage.cache_read_input_tokens || 0;
  const created = cacheWriteTokens(usage);
  const text = read > 0 || created > 0
    ? `栞 ─ 読 ${fmt(read)} ・ 書 ${fmt(created)} ・ 素 ${fmt(usage.input_tokens)} ・ 出 ${fmt(usage.output_tokens)}`
    : `栞、挟まらず ─ 素 ${fmt(usage.input_tokens)} ・ 出 ${fmt(usage.output_tokens)}`;
  const prefix = stopReason && stopReason !== "end_turn" ? `${stopReason} ─ ` : "";
  const costText = !cost ? "" : cost.unpriced ? " ・ 単価未設定" : ` ・ ${formatUSD(cost.total)}`;
  return <div className="usage-line">{prefix}{text}{costText}</div>;
}

function ConversationScreen({
  apiKey, building, room, thread, memories, retrospects, notes, ledger, priceTable,
  onBack, onUpdateThread, onAddNotes, onRecordSpend, onOpenBundleMemory, onOpenMemories,
}) {
  const [draft, setDraft] = useState("");
  const [sending, setSending] = useState(false);
  const [bundling, setBundling] = useState(false);
  const [error, setError] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [editingIndex, setEditingIndex] = useState(null);
  const [editText, setEditText] = useState("");
  const [confirmResend, setConfirmResend] = useState(null); // { index, count }
  const [streamText, setStreamText] = useState(""); // ストリーミング中の本文（保存前のプレーン表示用）
  const [showSpend, setShowSpend] = useState(false); // 支出の内訳を開いているか
  const ttl = room.cacheTtl === "1h" ? "1h" : "5m";
  const spend = summarizeLedger(ledger, ttl, priceTable);
  const bottomRef = useRef(null);
  const lastAssistantRef = useRef(null); // 最後のメッセージが assistant のときだけ付く
  const followRef = useRef(true); // ストリーミング中に下端へ追尾するか（手で上にスクロールしたら止める）
  const autoScrollYRef = useRef(null); // 追尾で最後に合わせた scrollY（これより上にいれば手で戻したとみなす）
  const jumpPendingRef = useRef(false); // 保存直後、その発言の頭へジャンプする
  const jumpedRef = useRef(false); // ジャンプ後、次の送信まで「最下部へ」を抑える
  const streamedTsRef = useRef(null); // ストリーミング表示から切り替わった発言（フェードインを省き、ちらつかせない）
  const streamBufRef = useRef(""); // 届いた本文の全体。描画（マークダウン変換）は requestAnimationFrame で間引く
  const streamRafRef = useRef(null);

  function resetStream() {
    if (streamRafRef.current !== null) cancelAnimationFrame(streamRafRef.current);
    streamRafRef.current = null;
    streamBufRef.current = "";
    setStreamText("");
  }

  function appendStream(t) {
    streamBufRef.current += t;
    if (streamRafRef.current !== null) return;
    streamRafRef.current = requestAnimationFrame(() => {
      streamRafRef.current = null;
      setStreamText(streamBufRef.current);
    });
  }

  useEffect(() => () => { if (streamRafRef.current !== null) cancelAnimationFrame(streamRafRef.current); }, []);

  function scrollToBottom() {
    window.scrollTo({ top: document.documentElement.scrollHeight });
  }

  useEffect(() => {
    // 完了時：保存した assistant 発言の先頭を、固定ヘッダーの下に合わせる（即時）
    if (jumpPendingRef.current && lastAssistantRef.current) {
      jumpPendingRef.current = false;
      jumpedRef.current = true;
      const el = lastAssistantRef.current;
      const topbar = document.querySelector(".topbar");
      if (topbar) el.style.scrollMarginTop = `${topbar.offsetHeight + 8}px`;
      el.scrollIntoView({ block: "start" });
      return;
    }
    if (jumpedRef.current) return;
    // 入力欄が画面下部に固定されているため、末尾要素ではなくページ最下部までスクロールして
    // 最新メッセージが入力欄の裏に隠れないようにする。
    if (bottomRef.current) scrollToBottom();
  }, [thread.messages.length, sending]);

  // ストリーミング中の追尾。下端から120px以上離れている間（手で上に戻したとき）は追わない
  useEffect(() => {
    function handleScroll() {
      const el = document.documentElement;
      followRef.current = el.scrollHeight - (window.scrollY + window.innerHeight) < 120;
    }
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  useEffect(() => {
    if (!streamText) { autoScrollYRef.current = null; return; }
    // scroll イベントより先に次の文字が届いた場合に備え、前回の追尾位置より上にいれば追尾を止める
    if (autoScrollYRef.current !== null && window.scrollY < autoScrollYRef.current - 2) followRef.current = false;
    if (!followRef.current) return;
    scrollToBottom();
    autoScrollYRef.current = window.scrollY;
  }, [streamText]);

  // 送信処理の共通部分。nextMessages の末尾は送信するユーザー発言であること。
  async function sendToModel(nextMessages) {
    setError(null);
    jumpedRef.current = false;
    jumpPendingRef.current = false;
    followRef.current = true;
    resetStream();
    onUpdateThread({ ...thread, messages: nextMessages });
    setSending(true);
    // この送信で払った分（周ごと）。保存できた応答は「通常送信」、空応答・エラーで保存しなかった応答は「破棄」として帳簿に記録する
    const spentRounds = [];
    let saved = false;

    try {
      // block2 は据え置き（resolveBlock2）。ツールループの各周は同じ body を使うので、ターン内でも変わらない
      const block2Text = resolveBlock2({ room, thread, memories, retrospects, notes });
      const body = buildRequestBody({ building, room, memories, retrospects, notes, frozenDate: thread.frozenDate }, nextMessages, { block2Text });
      let json;
      try {
        json = await callModelWithContinuation({
          building, apiKey, body, onDelta: appendStream, onRound: (r) => spentRounds.push(r),
        });
      } catch (e) {
        // 途中で失敗しても、それまでに書き付けられた手控えは残す
        if (e.jotted) onAddNotes(e.jotted);
        throw e;
      }
      // 保存する形に整える（finalizeAssistantContent）。
      // ・クライアントツールの tool_use と、ループ中に返した tool_result は構造のまま残す。手控え欄は据え置きなので、
      //   モデルが次のターンで「自分が書き付けたこと」を確かめられる証拠はこれだけになる。
      //   手控えをOFFにした部屋では、送信時（buildRequestBody）に除去して前後の本文を結合する（tools 未定義エラーを避ける）。
      // 保存しないブロック：
      // ・thinking / redacted_thinking（前段の system・tools・履歴と紐づけて検証される。栞は block2 が綴じや書き付けで
      //   変わるため、残して再送すると不定期に400になる。記憶は記録帳・回想録・手控えが担う）
      // ・テキスト化された jot_note 呼び出し（保険。中身は手控えとして回収する。手控えOFFの部屋では除去だけ）
      // 継続ループ内（同一ターン）では無加工のまま積み直しているので、ここで落とすのは最終保存時のみ。
      // server_tool_use / web_search_tool_result は assistant content 内で完結するのでそのまま残す。
      const finalized = finalizeAssistantContent(json.content);
      const jotted = [...json.jotted, ...(room.jotNote ? finalized.jotted : [])];
      if (finalized.removed > 0) console.warn("[書斎] テキスト化された jot_note 呼び出しを回収", finalized.jotted);

      // 手控えは応答の成否（空応答・refusal を含む）に関わらず保存する
      if (jotted.length > 0) onAddNotes(jotted);

      // 空応答は保存しない。送ったユーザー発言は残すので、編集＆再送信でやり直せる。
      if (!hasVisibleText(finalized.content)) {
        console.warn("[書斎] 空応答 stop_reason", json.stop_reason, json.usage);
        const message = json.stop_reason === "refusal"
          ? "この話題には筆を執れなかったようだ。言い回しを変えて、もう一度試してみてほしい。"
          : jotted.length > 0
            ? "手控えは書き付けたが、返事の本文が空だった。もう一度送ってみてほしい。"
            : `返事が綴られなかった（${json.stop_reason}）。もう一度送ってみてほしい。`;
        throw new ShosaiError(message, { raw: emptyResponseDetail(json) });
      }

      // ts は応答が最終的に完了した時刻（継続ループ後）。表示・ログ専用で、API には送らない（buildRequestBody は role と content だけを送る）
      const assistantMessage = {
        role: "assistant", content: finalized.content,
        ts: nowISO(), usage: json.usage, stopReason: json.stop_reason,
      };
      // 金額の計算用：その発言を返したモデルと、複数回リクエストしたターンの各回の usage（表示専用。API には送らない）
      if (json.model) assistantMessage.model = json.model;
      if (json.rounds && json.rounds.length > 1) assistantMessage.rounds = json.rounds;
      if (jotted.length > 0) assistantMessage.jotted = jotted;
      saved = true;
      jumpPendingRef.current = true;
      streamedTsRef.current = assistantMessage.ts;
      onUpdateThread({ ...thread, messages: [...nextMessages, assistantMessage] });
      if (json.truncated) {
        setError(new ShosaiError(`ツールの呼び出しが続きすぎたので、途中で打ち切った（上限${TOOL_LOOP_MAX}回）。ここまでの返事と手控えは残してある。`));
      }
    } catch (e) {
      setError(e);
    } finally {
      if (spentRounds.length > 0) onRecordSpend(saved ? "send" : "discard", spentRounds);
      resetStream();
      setSending(false);
    }
  }

  function handleSend() {
    const text = draft.trim();
    if (!text || sending) return;
    setDraft("");
    const userMessage = { role: "user", content: text, ts: nowISO() };
    sendToModel([...thread.messages, userMessage]);
  }

  function startEdit(index) {
    if (sending || bundling || editingIndex !== null) return;
    setEditingIndex(index);
    setEditText(extractPlainText(thread.messages[index].content));
  }

  function cancelEdit() {
    setEditingIndex(null);
    setEditText("");
  }

  function handleResend() {
    if (editingIndex === null || !editText.trim() || sending || bundling) return;
    const count = thread.messages.length - editingIndex - 1;
    if (count > 0) {
      setConfirmResend({ index: editingIndex, count });
    } else {
      doResend(editingIndex);
    }
  }

  // 編集対象の直前まで切り詰め、編集後の発言から作り直す
  function doResend(index) {
    const text = editText.trim();
    setConfirmResend(null);
    cancelEdit();
    // 編集後の発言は再送信した時刻で作り直す
    const userMessage = { role: "user", content: text, ts: nowISO() };
    sendToModel([...thread.messages.slice(0, index), userMessage]);
  }

  function handleSaveLog(format) {
    setMenuOpen(false);
    const base = `shiori_${room.name}_${thread.frozenDate}`;
    if (format === "json") {
      const data = {
        app: "shiori",
        type: "thread",
        exportedAt: nowISO(),
        building: { name: building.name, model: building.model },
        room: { name: room.name },
        thread,
        // このスレッドの支出の帳簿（送信・綴じ・編み・破棄）
        ledger: ledger || [],
      };
      downloadFile(`${base}.json`, JSON.stringify(data, null, 2), "application/json");
    } else {
      downloadFile(`${base}.txt`, buildThreadText(building, room, thread), "text/plain;charset=utf-8");
    }
  }

  async function handleBundleMemory() {
    setMenuOpen(false);
    setBundling(true);
    setError(null);
    try {
      await onOpenBundleMemory();
    } catch (e) {
      setError(e);
    } finally {
      setBundling(false);
    }
  }

  return (
    <div className="page">
      <div className="topbar">
        <div className="topbar-title">
          <span className="crumb" onClick={onBack}>{building.name}</span>
          <span className="sep">/</span>
          <span className="crumb" onClick={onBack}>{room.name}</span>
          <span className="thread-cost" onClick={() => setShowSpend(true)} title="このスレッドの支出（概算）">
            {formatUSD(spend.total)}{spend.unpriced > 0 ? "（一部未計上）" : ""}
          </span>
        </div>
        <div className="topbar-actions" style={{ position: "relative" }}>
          <button onClick={() => setMenuOpen((v) => !v)}>⋯</button>
          {menuOpen && (
            <div className="topbar-menu">
              <div><button onClick={handleBundleMemory} disabled={bundling}>記憶を綴じる</button></div>
              <div><button onClick={() => { setMenuOpen(false); onOpenMemories(); }}>記録帳を見る</button></div>
              <div><button onClick={() => handleSaveLog("text")}>ログを保存（テキスト）</button></div>
              <div><button onClick={() => handleSaveLog("json")}>ログを保存（JSON）</button></div>
            </div>
          )}
        </div>
      </div>

      <div className="messages">
        {thread.messages.length === 0 && !sending && (
          <div className="empty-hint">まだ何もない。話しかけてみてほしい。</div>
        )}
        {thread.messages.map((m, i) => {
          // 日付の区切り：直前の「時刻つき」発言とローカル日付が違うとき（時刻つきの最初の発言の前にも）。時刻なしの発言は飛ばす
          const timed = hasMsgTime(m);
          let showDateSep = false;
          if (timed) {
            let prev = null;
            for (let j = i - 1; j >= 0; j--) { if (hasMsgTime(thread.messages[j])) { prev = thread.messages[j]; break; } }
            showDateSep = !prev || localDayKey(prev.ts) !== localDayKey(m.ts);
          }
          return (
          <React.Fragment key={i}>
          {showDateSep && <div className="date-sep">{formatDateSep(m.ts)}</div>}
          <div
            className={`msg ${m.role === "user" ? "msg-user" : "msg-model"}${m.role === "user" && editingIndex === i ? " editing" : ""}`}
            style={m.ts && m.ts === streamedTsRef.current ? { animation: "none" } : undefined}
            ref={m.role === "assistant" && i === thread.messages.length - 1 ? lastAssistantRef : undefined}
          >
            {m.role === "user" && editingIndex === i ? (
              <div className="msg-edit">
                <textarea value={editText} onChange={(e) => setEditText(e.target.value)} autoFocus />
                <div className="composer-row">
                  <button onClick={cancelEdit}>やめる</button>
                  <button className="accent" onClick={handleResend} disabled={sending || bundling || !editText.trim()}>再送信</button>
                </div>
              </div>
            ) : m.role === "user" ? (
              <div className="bubble-user"><MessageContent content={m.content} /></div>
            ) : (
              <MessageContent content={m.content} markdown />
            )}
            {timed && !(m.role === "user" && editingIndex === i) && <div className="msg-time">{formatTimeHM(m.ts)}</div>}
            {m.role === "user" && editingIndex !== i && (
              <div className="msg-tools">
                <button onClick={() => startEdit(i)} disabled={sending || bundling || editingIndex !== null}>編集</button>
              </div>
            )}
            {m.role === "assistant" && <JottedLine jotted={m.jotted} />}
            {m.role === "assistant" && <UsageLine usage={m.usage} stopReason={m.stopReason} cost={messageCost(m, building.model, ttl, priceTable)} />}
          </div>
          </React.Fragment>
          );
        })}
        {sending && (
          streamText
            ? <div className="msg msg-model"><MarkdownText text={streamText} /></div>
            : <div className="msg msg-loading">{room.webSearch ? "（調べている）" : "（考えている）"}</div>
        )}
        {bundling && <div className="msg msg-loading">（記憶を綴じている）</div>}
        <div ref={bottomRef} />
      </div>

      <ErrorBox error={error} />

      <div className="composer">
        <textarea
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="話しかける…（Enterで改行、送信はボタン）"
        />
        <div className="composer-row">
          <div />
          <button className="accent" onClick={handleSend} disabled={sending || !draft.trim()}>送信</button>
        </div>
      </div>

      {showSpend && (
        <SpendBreakdownDialog title={`このスレッドの支出 ─ ${thread.title}`} summary={spend} onClose={() => setShowSpend(false)} />
      )}

      {confirmResend && (
        <ConfirmDialog
          title="この発言から作り直す"
          message={`ここから先の <strong>${confirmResend.count} 件</strong>が消えて、この発言から作り直しになる。よい？`}
          danger
          confirmLabel="作り直す"
          onCancel={() => setConfirmResend(null)}
          onConfirm={() => doResend(confirmResend.index)}
        />
      )}
    </div>
  );
}
