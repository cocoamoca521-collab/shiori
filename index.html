// 記録帳画面のインライン編集欄（会話画面の自分発言編集と同じ見た目）。空白のみでは確定できない。
function InlineTextEditor({ value, onChange, confirmLabel, onCancel, onConfirm }) {
  return (
    <div className="msg-edit">
      <textarea value={value} onChange={(e) => onChange(e.target.value)} autoFocus />
      <div className="composer-row">
        <button onClick={onCancel}>やめる</button>
        <button className="accent" onClick={onConfirm} disabled={!value.trim()}>{confirmLabel}</button>
      </div>
    </div>
  );
}

function MemoriesScreen({
  room, memories, retrospect, notes, roomSpend, onBack,
  onDeleteMemory, onDeleteNote, onSaveMemory, onSaveNote, onAddMemory, onAddNote, onWeave,
}) {
  const [weaving, setWeaving] = useState(false);
  const [confirmWeave, setConfirmWeave] = useState(false);
  const [error, setError] = useState(null);
  // 編集・追加は同時に1件まで。{ kind: "memory" | "note", id: 既存なら id、新規なら null }
  const [editing, setEditing] = useState(null);
  const [editText, setEditText] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null); // { kind: "memory" | "note", item }
  const busy = editing !== null || weaving;

  const sorted = [...memories].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const unwoven = memories.filter((m) => !m.woven);
  // 「編む」は、直近10件を除いた未編み記録が5件以上あるときだけ出す（＝未編み15件以上）
  const canWeave = unwoven.length >= RECENT_KEEP_COUNT + WEAVE_MIN_OLD;
  const sortedNotes = [...notes].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const charCount = unwoven.reduce((sum, m) => sum + m.text.length, 0) + (retrospect ? retrospect.text.length : 0)
    + notes.reduce((sum, n) => sum + n.text.length, 0);

  async function handleWeave() {
    setConfirmWeave(false);
    setWeaving(true);
    setError(null);
    try {
      await onWeave();
    } catch (e) {
      setError(e);
    } finally {
      setWeaving(false);
    }
  }

  function startEdit(kind, item) {
    if (busy) return;
    setEditing({ kind, id: item ? item.id : null });
    setEditText(item ? item.text : "");
  }

  function cancelEdit() {
    setEditing(null);
    setEditText("");
  }

  // 痕跡は残さない：text 以外（createdAt 等）は変えず、編集済みの印も付けない
  function confirmEdit() {
    const text = editText.trim();
    if (!editing || !text) return;
    const { kind, id } = editing;
    if (kind === "memory") {
      if (id) onSaveMemory(id, text); else onAddMemory(text);
    } else {
      if (id) onSaveNote(id, text); else onAddNote(text);
    }
    cancelEdit();
  }

  const isEditing = (kind, id) => editing && editing.kind === kind && editing.id === id;
  const editor = (label) => (
    <InlineTextEditor value={editText} onChange={setEditText} confirmLabel={label} onCancel={cancelEdit} onConfirm={confirmEdit} />
  );
  const smallBtn = { border: "none", marginLeft: 10, fontSize: 12 };
  const sectionHead = { display: "flex", justifyContent: "space-between", alignItems: "baseline", color: "var(--muted)", fontSize: 13, marginTop: 20 };

  return (
    <div className="page">
      <div className="topbar">
        <div className="topbar-title">
          <span className="crumb" onClick={onBack}>{room.name}</span>
          <span className="sep">/</span>
          <span className="crumb" style={{cursor:"default"}}>記録帳</span>
        </div>
        {canWeave && (
          <div className="topbar-actions">
            <button onClick={() => setConfirmWeave(true)} disabled={busy}>回想録を編む</button>
          </div>
        )}
      </div>

      <div className="usage-line" style={{ marginTop: 0, marginBottom: 16 }}>
        いま栞が携えている記憶：未編みの記録 {unwoven.length}件{retrospect ? " ＋ 回想録" : ""}{notes.length > 0 ? ` ＋ 手控え ${notes.length}件` : ""} ／ 約{charCount.toLocaleString()}字
      </div>

      {roomSpend && (
        <div className="usage-line" style={{ marginTop: -8, marginBottom: 16 }}>
          部屋の編み代 {formatUSD(roomSpend.total)}{roomSpend.unpriced > 0 ? "（一部未計上）" : ""} ─ スレッドを開かずに編んだ分
        </div>
      )}

      {weaving && <div className="msg msg-loading">（回想録を編んでいる）</div>}
      <ErrorBox error={error} />

      {/* 回想録は「回想録を編む」でのみ更新する。編集・削除・追加のUIは付けない */}
      {retrospect && (
        <div className="memory-row">
          <div style={{ color: "var(--muted)", fontSize: 13, marginBottom: 6 }}>
            回想録 ─ 遠い記憶（{formatDateJP(retrospect.updatedAt)}更新）
          </div>
          <div className="memory-text">{retrospect.text}</div>
        </div>
      )}

      <div style={sectionHead}>
        <span>手控え ─ 会話の途中で書き付けたこと（回想録には編まれない）</span>
        <button style={smallBtn} onClick={() => startEdit("note", null)} disabled={busy}>書き足す</button>
      </div>
      {isEditing("note", null) && <div className="memory-row">{editor("書き足す")}</div>}
      {sortedNotes.length === 0 && !isEditing("note", null) && <div className="empty-hint">まだ手控えはない。</div>}
      {sortedNotes.map((n) => (
        <div className="memory-row" key={n.id}>
          {isEditing("note", n.id) ? editor("保存") : (
            <>
              <div className="memory-text">{n.text}</div>
              <div className="memory-date">
                {formatDateJP(n.createdAt)}
                <button style={smallBtn} onClick={() => startEdit("note", n)} disabled={busy}>編集</button>
                <button style={smallBtn} onClick={() => setConfirmDelete({ kind: "note", item: n })} disabled={busy}>削除</button>
              </div>
            </>
          )}
        </div>
      ))}

      <div style={sectionHead}>
        <span>記録帳</span>
        <button style={smallBtn} onClick={() => startEdit("memory", null)} disabled={busy}>書き足す</button>
      </div>
      {isEditing("memory", null) && <div className="memory-row">{editor("書き足す")}</div>}
      {sorted.length === 0 && !isEditing("memory", null) ? (
        <div className="empty-hint">まだ記録はない。</div>
      ) : (
        <div className="list">
          {sorted.map((m) => (
            <div className="memory-row" key={m.id}>
              {isEditing("memory", m.id) ? editor("保存") : (
                <>
                  <div className="memory-text" style={m.woven ? { color: "var(--muted)" } : undefined}>{m.text}</div>
                  <div className="memory-date">
                    {m.woven && <span style={{ marginRight: 8 }}>編み済み</span>}
                    {formatDateJP(m.createdAt)}
                    <button style={smallBtn} onClick={() => startEdit("memory", m)} disabled={busy}>編集</button>
                    <button style={smallBtn} onClick={() => setConfirmDelete({ kind: "memory", item: m })} disabled={busy}>削除</button>
                  </div>
                </>
              )}
            </div>
          ))}
        </div>
      )}

      {confirmDelete && (
        <ConfirmDialog
          title={confirmDelete.kind === "note" ? "手控えを消す" : "記録を消す"}
          message={`この${confirmDelete.kind === "note" ? "手控え" : "記録"}を消す。『${escapeHtml(excerpt(confirmDelete.item.text, 20))}』。よい？`}
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            if (confirmDelete.kind === "note") onDeleteNote(confirmDelete.item.id);
            else onDeleteMemory(confirmDelete.item.id);
            setConfirmDelete(null);
          }}
        />
      )}

      {confirmWeave && (
        <ConfirmDialog
          title="回想録を編む"
          message={
            `直近10件を除いた古い記録 <strong>${memories.length - RECENT_KEEP_COUNT} 件</strong>を、ひとつづきの回想録に編み直す。` +
            (retrospect ? "いまの回想録は<strong>上書きされる</strong>。" : "") +
            "よい？"
          }
          confirmLabel="編む"
          onCancel={() => setConfirmWeave(false)}
          onConfirm={handleWeave}
        />
      )}
    </div>
  );
}

// 料金単価の編集欄。入力は書き換えるたびに（数として読める値なら）すぐ反映する。読めない値は欄を離れたときに元に戻す
function PriceTableEditor({ table, unpricedModels, onChange, onReset }) {
  const [version, setVersion] = useState(0); // 入力欄を作り直して、表示を保存済みの値に戻すための番号
  const [newId, setNewId] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);

  function setRate(rowKey, tier, field, text) {
    const v = Number(text);
    if (text.trim() === "" || !isFinite(v) || v < 0) return false;
    onChange(table.map((r) => {
      if (r.key !== rowKey) return r;
      if (tier === "over") return { ...r, over: { ...r.over, rates: { ...r.over.rates, [field]: v } } };
      return { ...r, rates: { ...r.rates, [field]: v } };
    }));
    return true;
  }

  function addModel(id) {
    const trimmed = String(id || "").trim();
    if (!trimmed || findPriceRow(trimmed, table)) return;
    onChange([...table, { key: `custom-${uid()}`, label: trimmed, ids: [trimmed], custom: true, rates: { input: 0, write5m: 0, write1h: 0, read: 0, output: 0 } }]);
    setNewId("");
  }

  const grid = (row, tier, rates) => (
    <div className="price-grid">
      {PRICE_FIELDS.map(({ k, label }) => (
        <div key={`${version}-${tier}-${k}`}>
          <label>{label}</label>
          <input
            type="text"
            inputMode="decimal"
            defaultValue={String(rates[k])}
            onChange={(e) => setRate(row.key, tier, k, e.target.value)}
            onBlur={(e) => { if (!setRate(row.key, tier, k, e.target.value)) setVersion((n) => n + 1); }}
          />
        </div>
      ))}
    </div>
  );

  return (
    <div className="settings-block">
      <h2>料金単価</h2>
      <div className="usage-line" style={{ marginTop: 0, marginBottom: 6 }}>
        USD ／ 100万トークン。スレッドの概算金額の計算に使う（表示だけで、送る内容には影響しない）。
      </div>
      {table.map((row) => (
        <div className="price-row" key={`${version}-${row.key}`}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
            <span>{row.label}</span>
            {row.custom && (
              <button style={{ border: "none", fontSize: 12, color: "var(--muted)" }} onClick={() => onChange(table.filter((r) => r.key !== row.key))}>削除</button>
            )}
          </div>
          {row.over && <div className="usage-line" style={{ marginTop: 4 }}>入力合計 {row.over.threshold.toLocaleString()} 以下</div>}
          {grid(row, "base", row.rates)}
          {row.over && (
            <>
              <div className="usage-line" style={{ marginTop: 8 }}>入力合計 {row.over.threshold.toLocaleString()} 超（そのリクエスト全体）</div>
              {grid(row, "over", row.over.rates)}
            </>
          )}
        </div>
      ))}
      {unpricedModels.length > 0 && (
        <div className="price-row">
          {unpricedModels.map((id) => (
            <div className="kv-row" key={id} style={{ borderBottom: "none", padding: "4px 0" }}>
              <span>{id} ─ 単価未設定</span>
              <button onClick={() => addModel(id)}>単価を追加</button>
            </div>
          ))}
        </div>
      )}
      <div className="kv-row">
        <input type="text" value={newId} onChange={(e) => setNewId(e.target.value)} placeholder="モデルIDを入れて追加（例：claude-xxx）" />
        <button style={{ flexShrink: 0 }} disabled={!newId.trim() || !!findPriceRow(newId, table)} onClick={() => addModel(newId)}>追加</button>
      </div>
      <div className="kv-row">
        <span>組み込みの単価（2026年11月時点）に戻す</span>
        <button style={{ flexShrink: 0 }} onClick={() => setConfirmReset(true)}>初期値に戻す</button>
      </div>
      {confirmReset && (
        <ConfirmDialog
          title="料金単価を初期値に戻す"
          message="編集した単価と、追加したモデルの単価は消えて、組み込みの初期値に戻る。よい？"
          confirmLabel="戻す"
          onCancel={() => setConfirmReset(false)}
          onConfirm={() => { setConfirmReset(false); onReset(); setVersion((n) => n + 1); }}
        />
      )}
    </div>
  );
}

function SettingsScreen({ apiKey, theme, priceTable, unpricedModels, onChangePrices, onResetPrices, onBack, onSaveApiKey, onDeleteApiKey, onToggleTheme, onWipeAll, onExportBackup, onRestoreBackup, onScanJotCleanup, onRunJotCleanup }) {
  const [cleanupScan, setCleanupScan] = useState(null); // 調べた結果（summary）
  const [cleanupResult, setCleanupResult] = useState(null); // 掃除した結果（summary）
  const [confirmCleanup, setConfirmCleanup] = useState(false);
  const [cleanupError, setCleanupError] = useState(null);
  const [editingKey, setEditingKey] = useState(false);
  const [keyValue, setKeyValue] = useState("");
  const [confirmWipe, setConfirmWipe] = useState(false);
  const [confirmDeleteKey, setConfirmDeleteKey] = useState(false);
  const [pendingBackup, setPendingBackup] = useState(null);
  const [importError, setImportError] = useState(null);
  const fileInputRef = useRef(null);

  async function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // 同じファイルを選び直せるように
    if (!file) return;
    setImportError(null);
    try {
      const data = JSON.parse(await file.text());
      if (!isValidBackup(data)) throw new Error("invalid");
      setPendingBackup(data);
    } catch (err) {
      setImportError({ message: "このファイルは栞のバックアップではないようだ。" });
    }
  }

  return (
    <div className="page">
      <div className="topbar">
        <div className="topbar-title">
          <span className="crumb" onClick={onBack}>栞</span>
          <span className="sep">/</span>
          <span className="crumb" style={{cursor:"default"}}>設定</span>
        </div>
      </div>

      <div className="settings-block">
        <h2>APIキー</h2>
        {editingKey ? (
          <div className="field">
            <input type="password" value={keyValue} onChange={(e) => setKeyValue(e.target.value)} placeholder="sk-ant-..." autoFocus />
            <div className="modal-actions">
              <button onClick={() => setEditingKey(false)}>やめる</button>
              <button className="accent" disabled={!keyValue.trim()} onClick={() => { onSaveApiKey(keyValue.trim()); setEditingKey(false); setKeyValue(""); }}>保存する</button>
            </div>
          </div>
        ) : (
          <div className="kv-row">
            <span>{apiKey ? "•••• " + apiKey.slice(-4) : "未設定"}</span>
            <div className="row-actions">
              <button onClick={() => setEditingKey(true)}>変更</button>
              <button onClick={() => setConfirmDeleteKey(true)}>削除</button>
            </div>
          </div>
        )}
      </div>

      <div className="settings-block">
        <h2>ダークモード</h2>
        <div className="kv-row">
          <span>{theme === "dark" ? "夜の書斎" : "昼の書斎"}</span>
          <button onClick={onToggleTheme}>切り替える</button>
        </div>
      </div>

      <PriceTableEditor table={priceTable} unpricedModels={unpricedModels} onChange={onChangePrices} onReset={onResetPrices} />

      <div className="settings-block">
        <h2>バックアップ</h2>
        <div className="kv-row">
          <span>棟・部屋・スレッド・記録・支出の帳簿を書き出す</span>
          <button onClick={onExportBackup}>書き出す</button>
        </div>
        <div className="kv-row">
          <span>バックアップから元に戻す</span>
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()}>読み込む</button>
        </div>
        <input
          ref={fileInputRef}
          type="file"
          accept=".json,application/json"
          style={{ display: "none" }}
          onChange={handleImportFile}
        />
        <ErrorBox error={importError} />
      </div>

      <div className="settings-block">
        <h2>書き付けの掃除</h2>
        <div className="kv-row">
          <span>会話・記録帳・回想録に文字のまま残った手控えの呼び出しを取り除き、中身を手控えに救出する</span>
          <button style={{ flexShrink: 0 }} onClick={() => { setCleanupResult(null); setCleanupError(null); setCleanupScan(onScanJotCleanup()); }}>調べる</button>
        </div>
        {cleanupScan && !cleanupResult && (
          <div className="kv-row" style={{ display: "block" }}>
            {cleanupScan.total === 0 ? (
              <div>残っている呼び出しは見つからなかった。</div>
            ) : (
              <>
                <div>見つかった呼び出し：{cleanupScan.total}件（会話の発言 {cleanupScan.messages}件・記録帳 {cleanupScan.memories}件・回想録 {cleanupScan.retrospects}件）</div>
                {cleanupScan.rooms.map((r, i) => <div key={i}>・{r.name}：{r.count}件</div>)}
                <div>救出できる手控え：{cleanupScan.rescued}件{cleanupScan.skippedDup > 0 ? `（同じ手控えが既にあるもの ${cleanupScan.skippedDup}件は保存しない）` : ""}</div>
                <div className="modal-actions">
                  <button className="accent" onClick={() => setConfirmCleanup(true)}>掃除する</button>
                </div>
              </>
            )}
          </div>
        )}
        {cleanupResult && (
          <div className="kv-row" style={{ display: "block" }}>
            <div>掃除した。呼び出しを {cleanupResult.total}件 取り除き、手控えを {cleanupResult.rescued}件 救出した。</div>
            {cleanupResult.droppedMessages > 0 && <div>（本文が呼び出しだけだった発言 {cleanupResult.droppedMessages}件は消した）</div>}
            {cleanupResult.skippedDup > 0 && <div>（同じ手控えが既にあったもの {cleanupResult.skippedDup}件は保存しなかった）</div>}
          </div>
        )}
        {(cleanupScan || cleanupResult) && (cleanupResult || cleanupScan).promptRooms.length > 0 && (
          <div className="kv-row" style={{ display: "block" }}>
            部屋のシステムプロンプトに呼び出し書式の例が書かれている：{(cleanupResult || cleanupScan).promptRooms.join("、")}。モデルが真似をするので、部屋の設定から消しておくとよい。
          </div>
        )}
        <ErrorBox error={cleanupError} />
      </div>

      <div className="settings-block">
        <h2>データ全消去</h2>
        <div className="kv-row">
          <span>棟・部屋・スレッド・記録をすべて消す</span>
          <button className="danger" onClick={() => setConfirmWipe(true)}>全消去</button>
        </div>
      </div>

      {confirmDeleteKey && (
        <ConfirmDialog
          title="APIキーを消す"
          message="APIキーを消す。会話や記録は残る。キーを入れ直せばまた使える。よい？"
          onCancel={() => setConfirmDeleteKey(false)}
          onConfirm={() => { setConfirmDeleteKey(false); onDeleteApiKey(); }}
        />
      )}

      {confirmWipe && (
        <ConfirmDialog
          title="全データを消去する"
          message="棟・部屋・スレッド・記録・APIキーが<strong>すべて消える</strong>。これは元に戻せない。よい？"
          requireDouble
          onCancel={() => setConfirmWipe(false)}
          onConfirm={() => { onWipeAll(); setConfirmWipe(false); }}
        />
      )}

      {confirmCleanup && (
        <ConfirmDialog
          title="書き付けを掃除する"
          message="先に全データのバックアップを書き出してから、見つかった呼び出しを取り除き、中身を手控えに救出する。よい？"
          confirmLabel="掃除する"
          onCancel={() => setConfirmCleanup(false)}
          onConfirm={() => {
            setConfirmCleanup(false);
            try {
              setCleanupResult(onRunJotCleanup());
              setCleanupScan(null);
            } catch (e) {
              setCleanupError(new ShosaiError("掃除できなかった。データは変えていない。", { raw: String(e) }));
            }
          }}
        />
      )}

      {pendingBackup && (
        <ConfirmDialog
          title="バックアップを読み込む"
          message="今あるデータは<strong>すべて</strong>、このバックアップの内容に置き換わる。よい？"
          danger
          requireDouble
          confirmLabel="置き換える"
          onCancel={() => setPendingBackup(null)}
          onConfirm={() => onRestoreBackup(pendingBackup)}
        />
      )}
    </div>
  );
}

/* ===== ルートApp ===== */

function initialTheme() {
  const stored = localStorage.getItem(K.theme);
  if (stored === "light" || stored === "dark") return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function App() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(K.apiKey) || "");
  const [theme, setTheme] = useState(initialTheme);
  const [buildings, setBuildingsState] = useState(() => loadJSON(K.buildings, []));
  const [rooms, setRoomsState] = useState(() => loadJSON(K.rooms, []));
  const [threads, setThreadsState] = useState(() => {
    const loaded = loadJSON(K.threads, []);
    const normalized = normalizeThreadMessages(loaded);
    if (normalized !== loaded) saveJSON(K.threads, normalized);
    return normalized;
  });
  const [memories, setMemoriesState] = useState(() => loadJSON(K.memories, []));
  const [retrospects, setRetrospectsState] = useState(() => loadJSON(K.retrospects, {}));
  const [notes, setNotesState] = useState(() => loadJSON(K.notes, []));
  const [ledgers, setLedgersState] = useState(() => normalizeLedgers(loadJSON(K.ledgers, EMPTY_LEDGERS)));
  const [priceTable, setPriceTableState] = useState(() => loadPriceTable());
  const [route, setRoute] = useState(() => computeInitialRoute());

  function computeInitialRoute() {
    const lastThreadId = localStorage.getItem(K.lastThreadId);
    if (lastThreadId) {
      const t = loadJSON(K.threads, []).find((x) => x.id === lastThreadId);
      if (t) {
        const r = loadJSON(K.rooms, []).find((x) => x.id === t.roomId);
        if (r) {
          const b = loadJSON(K.buildings, []).find((x) => x.id === r.buildingId);
          if (b) return { screen: "conversation", buildingId: b.id, roomId: r.id, threadId: t.id };
        }
      }
    }
    return { screen: "entrance" };
  }

  // 深い階層への遷移はhistoryに1段積む。玄関で戻るを押したときだけ
  // 通常のブラウザ挙動(アプリ終了)に任せられるよう、玄関は積まずreplaceする。
  function navigate(nextRoute) {
    setRoute(nextRoute);
    window.history.pushState(nextRoute, "");
  }

  // 上の階層に戻る操作は常にhistory.back()を経由させる。
  // これでパンくずタップとAndroidの戻るボタンが同じ結果になる。
  function goBack() {
    window.history.back();
  }

  useEffect(() => {
    if (route.screen === "conversation") {
      window.history.replaceState({ screen: "entrance" }, "");
      window.history.pushState({ screen: "rooms", buildingId: route.buildingId }, "");
      window.history.pushState({ screen: "threads", buildingId: route.buildingId, roomId: route.roomId }, "");
      window.history.pushState(route, "");
    } else {
      window.history.replaceState(route, "");
    }
  }, []);

  useEffect(() => {
    function handlePopState(e) {
      setRoute(e.state || { screen: "entrance" });
    }
    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    if (themeMeta) themeMeta.setAttribute("content", theme === "dark" ? "#352A2D" : "#EBDCD0");
    localStorage.setItem(K.theme, theme);
  }, [theme]);

  function setBuildings(next) { setBuildingsState(next); saveJSON(K.buildings, next); }
  function setRooms(next) { setRoomsState(next); saveJSON(K.rooms, next); }
  function setThreads(next) { setThreadsState(next); saveJSON(K.threads, next); }
  function setMemories(next) { setMemoriesState(next); saveJSON(K.memories, next); }
  function setRetrospects(next) { setRetrospectsState(next); saveJSON(K.retrospects, next); }
  function setNotes(next) { setNotesState(next); saveJSON(K.notes, next); }
  function setLedgers(next) { setLedgersState(next); saveJSON(K.ledgers, next); }
  function setPriceTable(next) { setPriceTableState(next); saveJSON(K.prices, next); }
  function resetPriceTable() { localStorage.removeItem(K.prices); setPriceTableState(DEFAULT_PRICE_TABLE); }

  // 帳簿の無いスレッドに、保存済みの発言から帳簿を作って入れる（一度だけ）。ledgersData を書き換えて、作ったかを返す
  function ensureThreadLedger(ledgersData, threadId) {
    if (Array.isArray(ledgersData.threads[threadId])) return false;
    const t = loadJSON(K.threads, []).find((x) => x.id === threadId);
    if (!t) return false;
    const r = loadJSON(K.rooms, []).find((x) => x.id === t.roomId);
    const b = r && loadJSON(K.buildings, []).find((x) => x.id === r.buildingId);
    ledgersData.threads[threadId] = ledgerFromMessages(t, b ? b.model : null);
    return true;
  }

  // 支出を帳簿に記録する。rounds は API を呼んだ回ごとの { model, usage }。
  // threadId のスレッドがあればそこへ、無ければ（スレッドを開かずに編んだ等）roomId の部屋の帳簿へ。
  // 送信は非同期で終わるため、レンダー時点の ledgers ではなく保存済みの最新に足す。発言が消えても帳簿からは消さない
  function recordSpend({ threadId, roomId }, kind, rounds) {
    const list = (rounds || []).filter((r) => r && r.usage);
    if (list.length === 0) return;
    const ts = nowISO();
    const entries = list.map((r) => ({ ts, kind, model: r.model || null, usage: r.usage }));
    const next = normalizeLedgers(loadJSON(K.ledgers, EMPTY_LEDGERS));
    if (threadId && (Array.isArray(next.threads[threadId]) || ensureThreadLedger(next, threadId))) {
      next.threads[threadId] = [...next.threads[threadId], ...entries];
    } else if (roomId) {
      next.rooms[roomId] = [...(Array.isArray(next.rooms[roomId]) ? next.rooms[roomId] : []), ...entries];
    } else return;
    setLedgers(next);
  }

  // 帳簿の無い既存スレッドを開いたら、過去の発言の usage から帳簿を作る（一度だけ）
  useEffect(() => {
    if (route.screen !== "conversation" || !route.threadId) return;
    const next = normalizeLedgers(loadJSON(K.ledgers, EMPTY_LEDGERS));
    if (ensureThreadLedger(next, route.threadId)) setLedgers(next);
  }, [route.screen, route.threadId]);

  // 消えたスレッド・部屋の帳簿を片づける
  function pruneLedgers({ threadIds = [], roomIds = [] }) {
    const next = normalizeLedgers(loadJSON(K.ledgers, EMPTY_LEDGERS));
    threadIds.forEach((id) => delete next.threads[id]);
    roomIds.forEach((id) => delete next.rooms[id]);
    setLedgers(next);
  }
  // 全データのバックアップを書き出す。APIキー・テーマ・lastThreadId は含めない
  function exportBackup(suffix) {
    const data = {
      app: "shiori", version: 1, exportedAt: nowISO(), buildings, rooms, threads, memories, retrospects, notes: loadJSON(K.notes, []),
      ledgers: normalizeLedgers(loadJSON(K.ledgers, EMPTY_LEDGERS)),
      prices: loadJSON(K.prices, null), // 単価を編集していなければ null（初期値のまま）
    };
    const name = suffix ? `shiori_backup_${todayYMD()}_${suffix}.json` : `shiori_backup_${todayYMD()}.json`;
    downloadFile(name, JSON.stringify(data, null, 2), "application/json");
  }
  // 手控えの追記。送信は非同期で終わるため、レンダー時点の notes ではなく保存済みの最新から足す。
  function addNotes(roomId, texts) {
    const ts = nowISO();
    const added = texts.map((text) => ({ id: uid(), roomId, text, createdAt: ts }));
    setNotes([...loadJSON(K.notes, []), ...added]);
  }

  if (!apiKey) {
    return (
      <ApiKeyGate
        onSave={(key) => {
          localStorage.setItem(K.apiKey, key);
          setApiKey(key);
        }}
      />
    );
  }

  // 単価表に無いモデル（棟のモデル・帳簿・発言に出てくるもの）。設定画面で「単価未設定」として出す
  function unpricedModelIds() {
    const ids = new Set();
    buildings.forEach((b) => b.model && ids.add(b.model));
    Object.values(ledgers.threads).concat(Object.values(ledgers.rooms)).forEach((list) => {
      if (Array.isArray(list)) list.forEach((e) => e && e.model && ids.add(e.model));
    });
    threads.forEach((t) => (t.messages || []).forEach((m) => {
      if (m && m.model) ids.add(m.model);
      if (m && Array.isArray(m.rounds)) m.rounds.forEach((r) => r && r.model && ids.add(r.model));
    }));
    const seen = new Set();
    return [...ids].filter((id) => {
      if (findPriceRow(id, priceTable)) return false;
      const n = normalizeModelId(id);
      if (seen.has(n)) return false;
      seen.add(n);
      return true;
    });
  }

  const building = buildings.find((b) => b.id === route.buildingId);
  const room = rooms.find((r) => r.id === route.roomId);
  const thread = threads.find((t) => t.id === route.threadId);

  if (route.screen === "settings") {
    return (
      <SettingsScreen
        apiKey={apiKey}
        theme={theme}
        priceTable={priceTable}
        unpricedModels={unpricedModelIds()}
        onChangePrices={setPriceTable}
        onResetPrices={resetPriceTable}
        onBack={goBack}
        onSaveApiKey={(key) => { localStorage.setItem(K.apiKey, key); setApiKey(key); }}
        onDeleteApiKey={() => { localStorage.removeItem(K.apiKey); setApiKey(""); }}
        onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
        onWipeAll={() => {
          Object.values(K).forEach((k) => localStorage.removeItem(k));
          window.location.reload();
        }}
        onExportBackup={() => exportBackup()}
        onScanJotCleanup={() => planTextualJotCleanup({ rooms, threads, memories, retrospects, notes }).summary}
        onRunJotCleanup={() => {
          // 実行前に必ず全データのバックアップを書き出す。失敗したら掃除しない
          exportBackup("before_cleanup");
          const plan = planTextualJotCleanup({ rooms, threads, memories, retrospects, notes: loadJSON(K.notes, []) });
          setThreads(plan.next.threads);
          setMemories(plan.next.memories);
          setRetrospects(plan.next.retrospects);
          setNotes(plan.next.notes);
          invalidateBlock2(); // 記録帳・回想録・手控えを書き換えたので、全スレッドの控えを捨てる
          return plan.summary;
        }}
        onRestoreBackup={(data) => {
          // 全置き換え。APIキーとテーマには触らない
          saveJSON(K.buildings, data.buildings);
          saveJSON(K.rooms, data.rooms);
          saveJSON(K.threads, normalizeThreadMessages(data.threads));
          saveJSON(K.memories, data.memories);
          // 回想録キーの無い旧バックアップも読み込める
          saveJSON(K.retrospects, data.retrospects && typeof data.retrospects === "object" ? data.retrospects : {});
          // 手控えキーの無い旧バックアップも読み込める
          saveJSON(K.notes, Array.isArray(data.notes) ? data.notes : []);
          // 帳簿キーの無い旧バックアップも読み込める（各スレッドを開いたときに発言から作り直す）
          saveJSON(K.ledgers, normalizeLedgers(data.ledgers));
          // 単価を編集したバックアップなら単価も戻す。無ければ今の単価のまま
          if (Array.isArray(data.prices)) saveJSON(K.prices, data.prices);
          localStorage.removeItem(K.lastThreadId);
          invalidateBlock2(); // データを丸ごと入れ替えたので控えも捨てる
          window.location.reload();
        }}
      />
    );
  }

  if (route.screen === "memories" && building && room) {
    const roomMemories = memories.filter((m) => m.roomId === room.id);
    return (
      <MemoriesScreen
        room={room}
        memories={roomMemories}
        retrospect={retrospects[room.id] || null}
        notes={notes.filter((n) => n.roomId === room.id)}
        roomSpend={Array.isArray(ledgers.rooms[room.id]) && ledgers.rooms[room.id].length > 0
          ? summarizeLedger(ledgers.rooms[room.id], room.cacheTtl === "1h" ? "1h" : "5m", priceTable) : null}
        onBack={goBack}
        // 記録帳での編集・追加・削除は、次の送信から block2 に反映する（invalidateBlock2）
        onDeleteMemory={(id) => { setMemories(memories.filter((m) => m.id !== id)); invalidateBlock2(room.id); }}
        onDeleteNote={(id) => { setNotes(notes.filter((n) => n.id !== id)); invalidateBlock2(room.id); }}
        // 編集・追加は痕跡を残さない（editedAt 等のフィールドを作らない）。text だけを差し替え、createdAt は保つ
        onSaveMemory={(id, text) => { setMemories(memories.map((m) => (m.id === id ? { ...m, text } : m))); invalidateBlock2(room.id); }}
        onSaveNote={(id, text) => { setNotes(notes.map((n) => (n.id === id ? { ...n, text } : n))); invalidateBlock2(room.id); }}
        onAddMemory={(text) => { setMemories([...memories, { id: uid(), roomId: room.id, text, createdAt: nowISO(), woven: false }]); invalidateBlock2(room.id); }}
        onAddNote={(text) => { setNotes([...notes, { id: uid(), roomId: room.id, text, createdAt: nowISO() }]); invalidateBlock2(room.id); }}
        onWeave={async () => {
          // 編む対象：woven に関わらず、全記録のうち直近10件を除いたものを古い順に全件。
          // 毎回全量から再生成することで、過去に編んだ内容の劣化コピーの連鎖を防ぐ。
          const sortedAsc = [...roomMemories].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          const targets = sortedAsc.slice(0, Math.max(0, sortedAsc.length - RECENT_KEEP_COUNT));
          const listing = targets.map((m) => `${formatYMD(m.createdAt)}：${m.text}`).join("\n");
          // system はブロック1のみ（通常送信と同一コード経路・同一 cache_control）。
          // tools は部屋設定どおり付き、tool_choice: none で実行だけを封じる。手控え（notes）は編む対象に入れない。
          const body = buildRequestBody(
            { building, room, memories, retrospects, notes, frozenDate: "" },
            [],
            {
              maxTokens: RETROSPECT_MAX_TOKENS,
              toolChoice: { type: "none" },
              effort: "low", // 思考の中で書き終えて本文が空になるのを防ぐ
              block1Only: true,
              extraMessages: [{ role: "user", content: WEAVE_INSTRUCTION + listing }],
            },
          );
          // 編み代は、記録帳を開く前に開いていたスレッドに計上する。スレッドから来ていなければ部屋の帳簿へ
          const spendTarget = { threadId: thread && thread.roomId === room.id ? thread.id : null, roomId: room.id };
          const json = await callModelRetryOnEmpty(
            { building, apiKey, body, onRound: (r) => recordSpend(spendTarget, "weave", [r]) },
            (texts) => addNotes(room.id, texts),
          );
          console.log("[書斎] weave usage", json.usage, "読", json.usage && json.usage.cache_read_input_tokens, "書", cacheWriteTokens(json.usage));
          // 綴じと同じく、テキスト化された呼び出しは取り除き、中身は手控えとして回収する
          const finalized = finalizeAssistantContent(json.content);
          if (room.jotNote && finalized.jotted.length > 0) addNotes(room.id, finalized.jotted);
          const text = extractPlainText(finalized.content).trim();
          if (!text) {
            console.warn("[書斎] 編み空応答 stop_reason", json.stop_reason, json.usage);
            throw new ShosaiError("回想録が編めなかった。もう一度試してみてほしい。", {
              raw: emptyResponseDetail(json),
            });
          }
          const targetIds = new Set(targets.map((m) => m.id));
          setMemories(memories.map((m) => (targetIds.has(m.id) ? { ...m, woven: true } : m)));
          setRetrospects({ ...retrospects, [room.id]: { text, updatedAt: nowISO() } });
          invalidateBlock2(room.id); // 編んだ回想録を次の送信から block2 に入れる
        }}
      />
    );
  }

  if (route.screen === "conversation" && building && room && thread) {
    return (
      <ConversationScreen
        apiKey={apiKey}
        building={building}
        room={room}
        thread={thread}
        memories={memories}
        retrospects={retrospects}
        notes={notes}
        // 帳簿がまだ無い（初めて開いた直後）ときは、発言から作った帳簿で表示する（useEffect で保存される）
        ledger={Array.isArray(ledgers.threads[thread.id]) ? ledgers.threads[thread.id] : ledgerFromMessages(thread, building.model)}
        priceTable={priceTable}
        onRecordSpend={(kind, rounds) => recordSpend({ threadId: thread.id, roomId: room.id }, kind, rounds)}
        onBack={goBack}
        onUpdateThread={(updated) => {
          setThreads(threads.map((t) => (t.id === updated.id ? updated : t)));
        }}
        onAddNotes={(texts) => addNotes(room.id, texts)}
        // threadId を持たせて、記録帳で編んだときの編み代をこのスレッドに計上する
        onOpenMemories={() => navigate({ screen: "memories", buildingId: building.id, roomId: room.id, threadId: thread.id })}
        onOpenBundleMemory={async () => {
          // 棟のモデル本人が、会話の続きとして自分で綴じる。
          // 通常送信と同じ buildRequestBody を通すので、直前の会話のキャッシュをそのまま読める。
          // 綴じ指示と応答は thread.messages に保存しない。
          // block2 も通常送信と同じ据え置きのものを使い、プレフィックスを一致させる
          const block2Text = resolveBlock2({ room, thread, memories, retrospects, notes });
          const body = buildRequestBody(
            { building, room, memories, retrospects, notes, frozenDate: thread.frozenDate },
            thread.messages,
            {
              block2Text,
              maxTokens: BUNDLE_MAX_TOKENS,
              toolChoice: { type: "none" }, // tools は外さず、検索の実行だけを封じる
              effort: "low", // 思考の中で書き終えて本文が空になるのを防ぐ
              extraMessages: [{ role: "user", content: BUNDLE_INSTRUCTION }],
            },
          );
          // tool_choice: none なので通常は書き付けられないが、万一書き付けられたら手控えとして残す
          // 綴じ代は1回ずつ（自動リトライ・継続の各回も）このスレッドの帳簿に記録する
          const json = await callModelRetryOnEmpty(
            { building, apiKey, body, onRound: (r) => recordSpend({ threadId: thread.id, roomId: room.id }, "bundle", [r]) },
            (texts) => addNotes(room.id, texts),
          );
          console.log("[書斎] bundle usage", json.usage, "読", json.usage && json.usage.cache_read_input_tokens, "書", cacheWriteTokens(json.usage));
          // tool_choice: none だと呼び出しを本文にテキストで書くことがある。記録帳に入ると毎回注入されて真似が広がるので、
          // 必ず取り除き、中身は手控えとして回収する
          const finalized = finalizeAssistantContent(json.content);
          if (room.jotNote && finalized.jotted.length > 0) addNotes(room.id, finalized.jotted);
          const text = extractPlainText(finalized.content).trim();
          if (!text) {
            console.warn("[書斎] 綴じ空応答 stop_reason", json.stop_reason, json.usage);
            throw new ShosaiError("記録が綴られなかった。もう一度試してみてほしい。", {
              raw: emptyResponseDetail(json),
            });
          }
          const memory = { id: uid(), roomId: room.id, text, createdAt: nowISO() };
          setMemories([...memories, memory]);
          invalidateBlock2(room.id); // 綴じた記録を次の送信から block2 に入れる
        }}
      />
    );
  }

  if (route.screen === "threads" && building && room) {
    const roomThreads = threads.filter((t) => t.roomId === room.id);
    return (
      <ThreadsScreen
        building={building}
        room={room}
        threads={roomThreads}
        onBack={goBack}
        onOpenThread={(threadId) => {
          localStorage.setItem(K.lastThreadId, threadId);
          navigate({ screen: "conversation", buildingId: building.id, roomId: room.id, threadId });
        }}
        onCreateThread={() => {
          const ts = nowISO();
          const label = formatDateJP(ts);
          const newThread = { id: uid(), roomId: room.id, title: label, createdAt: ts, frozenDate: label, messages: [] };
          setThreads([...threads, newThread]);
          localStorage.setItem(K.lastThreadId, newThread.id);
          navigate({ screen: "conversation", buildingId: building.id, roomId: room.id, threadId: newThread.id });
        }}
        onRenameThread={(threadId, title) => {
          setThreads(threads.map((t) => (t.id === threadId ? { ...t, title } : t)));
        }}
        onDeleteThread={(threadId) => {
          setThreads(threads.filter((t) => t.id !== threadId));
          pruneLedgers({ threadIds: [threadId] });
          setMemories(memories); // 記録帳はスレッド削除では消えない(部屋単位のため)
          if (localStorage.getItem(K.lastThreadId) === threadId) localStorage.removeItem(K.lastThreadId);
        }}
        onOpenMemories={() => navigate({ screen: "memories", buildingId: building.id, roomId: room.id })}
      />
    );
  }

  if (route.screen === "rooms" && building) {
    const buildingRooms = rooms.filter((r) => r.buildingId === building.id);
    return (
      <RoomsScreen
        building={building}
        rooms={buildingRooms}
        onBack={goBack}
        onOpenRoom={(roomId) => navigate({ screen: "threads", buildingId: building.id, roomId })}
        onCreateRoom={(data) => {
          const newRoom = { id: uid(), buildingId: building.id, ...data, createdAt: nowISO() };
          setRooms([...rooms, newRoom]);
        }}
        onEditRoom={(roomId, data) => {
          setRooms(rooms.map((r) => (r.id === roomId ? { ...r, ...data } : r)));
        }}
        onDeleteRoom={(roomId) => {
          setRooms(rooms.filter((r) => r.id !== roomId));
          const doomedThreadIds = new Set(threads.filter((t) => t.roomId === roomId).map((t) => t.id));
          setThreads(threads.filter((t) => t.roomId !== roomId));
          pruneLedgers({ threadIds: [...doomedThreadIds], roomIds: [roomId] });
          setMemories(memories.filter((m) => m.roomId !== roomId));
          setNotes(notes.filter((n) => n.roomId !== roomId));
          if (retrospects[roomId]) {
            const nextRetrospects = { ...retrospects };
            delete nextRetrospects[roomId];
            setRetrospects(nextRetrospects);
          }
          if (doomedThreadIds.has(localStorage.getItem(K.lastThreadId))) localStorage.removeItem(K.lastThreadId);
        }}
      />
    );
  }

  // 玄関(デフォルト)
  return (
    <Entrance
      buildings={buildings}
      theme={theme}
      onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))}
      onOpenBuilding={(buildingId) => navigate({ screen: "rooms", buildingId })}
      onOpenSettings={() => navigate({ screen: "settings" })}
      onCreateBuilding={(data) => {
        const newBuilding = { id: uid(), ...data, createdAt: nowISO() };
        setBuildings([...buildings, newBuilding]);
      }}
      onEditBuilding={(buildingId, data) => {
        setBuildings(buildings.map((b) => (b.id === buildingId ? { ...b, ...data } : b)));
      }}
      onDeleteBuilding={(buildingId) => {
        const doomedRoomIds = new Set(rooms.filter((r) => r.buildingId === buildingId).map((r) => r.id));
        setBuildings(buildings.filter((b) => b.id !== buildingId));
        setRooms(rooms.filter((r) => r.buildingId !== buildingId));
        setThreads(threads.filter((t) => !doomedRoomIds.has(t.roomId)));
        pruneLedgers({ threadIds: threads.filter((t) => doomedRoomIds.has(t.roomId)).map((t) => t.id), roomIds: [...doomedRoomIds] });
        setMemories(memories.filter((m) => !doomedRoomIds.has(m.roomId)));
        setNotes(notes.filter((n) => !doomedRoomIds.has(n.roomId)));
        const nextRetrospects = { ...retrospects };
        doomedRoomIds.forEach((id) => delete nextRetrospects[id]);
        setRetrospects(nextRetrospects);
        if (doomedRoomIds.size > 0) localStorage.removeItem(K.lastThreadId);
      }}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
